<svg viewBox="0 0 880 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The engine asks one question per operation, through a request that names the operation and its subject. The application, which owns the permission model, answers through the policy seam with a single callback. The engine resolves that answer once and every surface follows it: the Customize button, the command palette, the inserter. Widgets are never asked. Without a policy, every operation is allowed.">
  <defs>
    <marker id="arrow-pol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="868" height="428" rx="12" fill="#ffffff"/>

  <text x="440" y="36" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155">The question flows out; the answer flows in.</text>

  <!-- Application -->
  <rect x="44" y="58" width="792" height="312" rx="9" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="64" y="84" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700" fill="#1d6b5a">application</text>
  <text x="162" y="84" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">owns the permission model: users, roles, sections, plans</text>

  <!-- Dashboard engine -->
  <rect x="64" y="98" width="508" height="254" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="84" y="124" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700" fill="#1d6b5a">dashboard</text>
  <text x="166" y="124" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">knows the operations · not the user</text>

  <!-- Resolution point -->
  <rect x="84" y="140" width="468" height="60" rx="5" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="96" y="160" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#475569">canPerform( { operation: 'insert', widgetType } )</text>
  <text x="96" y="178" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#475569">canPerform( { operation: 'customize' } )</text>
  <text x="540" y="190" text-anchor="end" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-style="italic" fill="#94a3b8">resolved once, in the provider</text>

  <!-- Surfaces -->
  <line x1="318" y1="200" x2="318" y2="214" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-pol)"/>
  <rect x="84" y="218" width="140" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="154" y="240" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#334155">Customize button</text>
  <text x="154" y="257" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#64748b">customize</text>

  <rect x="248" y="218" width="140" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="318" y="240" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#334155">command palette</text>
  <text x="318" y="257" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#64748b">customize</text>

  <rect x="412" y="218" width="140" height="52" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="482" y="240" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#334155">inserter</text>
  <text x="482" y="257" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#64748b">insert · per widget type</text>

  <!-- Widget: never asked -->
  <rect x="84" y="286" width="468" height="48" rx="9" fill="#fff3d0" stroke="#b07020" stroke-width="1.5"/>
  <text x="104" y="306" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#855317">widget</text>
  <text x="104" y="324" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#855317">never asked · a rejected type keeps rendering where already placed</text>

  <!-- Answer flow -->
  <line x1="600" y1="170" x2="576" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-pol)"/>

  <!-- The policy -->
  <rect x="600" y="118" width="212" height="112" rx="9" fill="#ffffff" stroke="#1d6b5a" stroke-width="1.4"/>
  <text x="616" y="142" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#1d6b5a">policy</text>
  <text x="616" y="164" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" fill="#475569">canPerform( request ): boolean</text>
  <text x="616" y="182" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" fill="#475569">true for what you do not govern</text>
  <text x="616" y="212" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-style="italic" fill="#94a3b8">only the application knows</text>
  <text x="706" y="250" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" font-weight="700" fill="#64748b">provided through WidgetDashboard.Policy</text>
  <text x="706" y="270" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-style="italic" fill="#94a3b8">nested policies only narrow</text>

  <text x="84" y="358" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#94a3b8">without a policy, every operation is allowed</text>

  <text x="440" y="406" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#855317">the engine asks · the application answers · the surfaces follow</text>
</svg>
