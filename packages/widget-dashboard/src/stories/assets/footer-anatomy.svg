<svg viewBox="0 0 860 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The footer strip under the widget body: a full-width divider, high-relevance actions as text links on the leading edge, medium-relevance actions as compact icon affordances on the trailing edge.">
  <rect x="6" y="6" width="848" height="198" rx="12" fill="#ffffff"/>

  <text x="430" y="34" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#64748b">the footer strip</text>

  <!-- The tile: body above the divider, footer below -->
  <rect x="40" y="54" width="780" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>

  <!-- Body hint -->
  <rect x="56" y="66" width="330" height="8" rx="4" fill="#eef2f7"/>
  <rect x="56" y="80" width="240" height="8" rx="4" fill="#eef2f7"/>

  <!-- Divider, edge to edge -->
  <line x1="40" y1="98" x2="820" y2="98" stroke="#cbd5e1" stroke-width="1.4"/>

  <!-- High: leading text link -->
  <text x="56" y="122" font-family="-apple-system, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#2f54a5">View all drafts</text>

  <!-- Medium: trailing icon-only affordance -->
  <rect x="778" y="106" width="26" height="24" rx="6" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.2"/>
  <path d="M791 111 v8 m-3.5 -3.5 l3.5 3.5 l3.5 -3.5 M786 124 h10" stroke="#475569" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Section brackets -->
  <path d="M56 148 L56 154 L150 154 L150 148" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="103" y="171" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">High</text>
  <text x="103" y="186" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">text links · leading</text>

  <path d="M778 148 L778 154 L804 154 L804 148" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="791" y="171" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">Medium</text>
  <text x="791" y="186" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">compact · trailing</text>
</svg>
