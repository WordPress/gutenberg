<svg viewBox="0 0 840 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Each attribute may carry a relevance hint. The widget declares importance; the host may promote high-relevance fields to a prominent surface and edit the rest through a settings surface built from the schema.">
  <defs>
    <marker id="arrow-relevance" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-relevance-high" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1d6b5a"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="828" height="348" rx="12" fill="#ffffff"/>

  <text x="420" y="38" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#334155">The widget declares importance; the host chooses the surface.</text>

  <!-- Attribute schema -->
  <rect x="44" y="72" width="248" height="168" rx="9" fill="#fff3d0" stroke="#b07020" stroke-width="1.5"/>
  <text x="64" y="100" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#855317">attributes</text>
  <text x="64" y="118" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" fill="#855317" opacity="0.8">declarative schema</text>

  <rect x="64" y="132" width="208" height="42" rx="5" fill="#ffffff" stroke="#b07020" stroke-width="1.2"/>
  <text x="76" y="150" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#855317">location</text>
  <text x="76" y="166" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="700" fill="#1d6b5a">relevance: high</text>

  <rect x="64" y="184" width="208" height="42" rx="5" fill="#ffffff" stroke="#e2c88a" stroke-width="1.2"/>
  <text x="76" y="202" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#855317">perPage</text>
  <text x="76" y="218" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#94a3b8">low (default)</text>

  <!-- Host: prominent surface -->
  <rect x="348" y="88" width="176" height="80" rx="9" fill="#fafbfc" stroke="#1d6b5a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="436" y="112" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1d6b5a">prominent surface</text>
  <text x="436" y="128" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#64748b">host may promote</text>
  <rect x="370" y="140" width="132" height="16" rx="3" fill="#ffffff" stroke="#1d6b5a" stroke-width="1.2"/>
  <text x="436" y="152" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#1d6b5a">high fields</text>

  <!-- Host: settings surface -->
  <rect x="348" y="188" width="176" height="96" rx="9" fill="#fafbfc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="436" y="212" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#64748b">settings surface</text>
  <text x="436" y="228" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" fill="#64748b">full schema form</text>
  <rect x="370" y="240" width="132" height="14" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="370" y="260" width="132" height="14" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- Connections from schema to surfaces -->
  <path d="M 272 153 L 344 128" fill="none" stroke="#1d6b5a" stroke-width="1.5" marker-end="url(#arrow-relevance-high)"/>
  <rect x="302" y="136" width="28" height="14" rx="3" fill="#ffffff"/>
  <text x="316" y="147" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#1d6b5a">high</text>

  <path d="M 272 205 L 344 244" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-relevance)"/>
  <rect x="302" y="222" width="26" height="14" rx="3" fill="#ffffff"/>
  <text x="315" y="233" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#64748b">low</text>

  <!-- Tile context (read-only) -->
  <rect x="576" y="104" width="168" height="156" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 585 106 H 735 Q 742 106 742 113 V 143 H 578 V 113 Q 578 106 585 106 Z" fill="#f1f5f9"/>
  <line x1="576" y1="143" x2="744" y2="143" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="594" y="114" width="16" height="16" rx="4" fill="#2f54a5"/>
  <text x="618" y="127" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">Events</text>
  <rect x="682" y="116" width="56" height="16" rx="4" fill="#d7f0ea" stroke="#1d6b5a" stroke-width="1"/>
  <text x="710" y="128" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#1d6b5a">location</text>
  <rect x="594" y="160" width="12" height="12" rx="3" fill="#e2e8f0"/>
  <line x1="614" y1="166" x2="710" y2="166" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="594" y="182" width="12" height="12" rx="3" fill="#e2e8f0"/>
  <line x1="614" y1="188" x2="680" y2="188" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="660" y="240" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#94a3b8">widget render</text>

  <rect x="530" y="104" width="40" height="24" rx="3" fill="#ffffff"/>
  <text x="550" y="114" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#1d6b5a">near</text>
  <text x="550" y="124" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#1d6b5a">instance</text>
  <line x1="524" y1="127" x2="572" y2="127" stroke="#1d6b5a" stroke-width="1.5" marker-end="url(#arrow-relevance-high)"/>

  <text x="420" y="328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#855317">importance, not surface. absent means low</text>
</svg>
