<svg viewBox="0 0 880 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A widget declares one action as pure data: an envelope of id and label, plus exactly one fulfillment key. From that single declaration the host makes three separate decisions: the fulfillment, what triggering the action means, inferred from the key present; the materialization, which primitive the host mounts, which must be a real link primitive wherever the surface allows one; and the placement, where the affordance goes, which the widget never names.">
  <defs>
    <marker id="arrow-aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="868" height="388" rx="12" fill="#ffffff"/>

  <text x="440" y="38" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155">One declaration, three decisions the host makes.</text>

  <text x="170" y="68" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#64748b">the widget declares</text>
  <text x="626" y="68" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#64748b">the host decides</text>

  <!-- The declaration -->
  <rect x="44" y="114" width="252" height="200" rx="9" fill="#fff3d0" stroke="#b07020" stroke-width="1.5"/>
  <text x="64" y="142" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" fill="#855317">action</text>
  <rect x="62" y="154" width="216" height="124" rx="5" fill="#ffffff" stroke="#b07020" stroke-width="1.2"/>
  <text x="74" y="172" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" font-weight="700" fill="#b07020" opacity="0.7">envelope</text>
  <text x="74" y="192" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#855317">id: 'view-report'</text>
  <text x="74" y="210" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#855317">label: 'View report'</text>
  <line x1="70" y1="222" x2="270" y2="222" stroke="#e8cf9e" stroke-width="1"/>
  <text x="74" y="240" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" font-weight="700" fill="#b07020" opacity="0.7">fulfillment</text>
  <text x="74" y="260" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="700" fill="#b07020">href: 'site-health.php'</text>
  <text x="64" y="298" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#94a3b8">pure data · exactly one fulfillment key</text>

  <!-- Fan -->
  <line x1="300" y1="214" x2="412" y2="122" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-aa)"/>
  <line x1="300" y1="214" x2="412" y2="214" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-aa)"/>
  <line x1="300" y1="214" x2="412" y2="306" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-aa)"/>

  <!-- Axis 1: fulfillment -->
  <rect x="416" y="84" width="420" height="76" rx="9" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="436" y="110" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700" fill="#1d6b5a">fulfillment</text>
  <text x="436" y="129" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#475569">what triggering the action means</text>
  <text x="436" y="147" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">inferred from the key present · today only href: go to a target</text>

  <!-- Axis 2: materialization -->
  <rect x="416" y="176" width="420" height="76" rx="9" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="436" y="202" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700" fill="#1d6b5a">materialization</text>
  <text x="436" y="221" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#475569">which primitive the host mounts</text>
  <text x="436" y="239" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">a real link primitive wherever the surface allows one</text>

  <!-- Axis 3: placement -->
  <rect x="416" y="268" width="420" height="76" rx="9" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="436" y="294" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700" fill="#1d6b5a">placement</text>
  <text x="436" y="313" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#475569">where the affordance goes</text>
  <text x="436" y="331" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">More menu, footer, command palette</text>

  <text x="440" y="372" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#855317">declared once · fulfilled one way · materialized per surface · placed by the host</text>
</svg>
