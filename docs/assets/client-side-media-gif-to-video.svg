<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The GIF to video conversion pipeline: detect an opaque animated GIF, decode frames with ImageDecoder, encode with the WebCodecs VideoEncoder and mediabunny, store the video and poster as companion files, and offer a block switch in the editor.">
  <defs>
    <style>
      .eyebrow { fill:#2d40e8; font-weight:700; font-size:13px; letter-spacing:1.5px; }
      .title { fill:#101419; font-weight:800; font-size:34px; }
      .subtitle { fill:#5c6470; font-size:19px; }
      .st { fill:#101419; font-weight:700; font-size:22px; }
      .body { fill:#3c434a; font-size:18px; }
      .mono { font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; }
      .num { fill:#ffffff; font-weight:700; font-size:19px; }
    </style>
  </defs>

  <rect width="1240" height="700" fill="#ffffff"/>

  <text class="eyebrow" x="40" y="52">CLIENT-SIDE MEDIA PROCESSING</text>
  <text class="title" x="40" y="95">Animated GIF → video conversion</text>
  <text class="subtitle" x="40" y="128">A separate WebCodecs pipeline — no libvips involved. Falls back transparently when <tspan class="mono" font-size="17">VideoEncoder</tspan> is unavailable.</text>

  <!-- connectors -->
  <g stroke="#d0d5da" stroke-width="2">
    <line x1="62" y1="226" x2="62" y2="288"/>
    <line x1="62" y1="332" x2="62" y2="368"/>
    <line x1="62" y1="412" x2="62" y2="474"/>
    <line x1="62" y1="518" x2="62" y2="580"/>
  </g>

  <!-- circles -->
  <g>
    <circle cx="62" cy="204" r="22" fill="#2d40e8"/><text class="num" x="62" y="211" text-anchor="middle">1</text>
    <circle cx="62" cy="310" r="22" fill="#2d40e8"/><text class="num" x="62" y="317" text-anchor="middle">2</text>
    <circle cx="62" cy="390" r="22" fill="#2d40e8"/><text class="num" x="62" y="397" text-anchor="middle">3</text>
    <circle cx="62" cy="496" r="22" fill="#2d40e8"/><text class="num" x="62" y="503" text-anchor="middle">4</text>
    <circle cx="62" cy="602" r="22" fill="#2d40e8"/><text class="num" x="62" y="609" text-anchor="middle">5</text>
  </g>

  <!-- 1 -->
  <text class="st" x="105" y="200">Detect</text>
  <text class="body" x="105" y="230"><tspan class="mono">isAnimatedGif()</tspan> confirms the GIF is animated and opaque — transparent GIFs stay images, since <tspan class="mono">&lt;video&gt;</tspan></text>
  <text class="body" x="105" y="256">can't reproduce their transparency.</text>

  <!-- 2 -->
  <text class="st" x="105" y="306">Decode</text>
  <text class="body" x="105" y="336">The browser's <tspan class="mono">ImageDecoder</tspan> unpacks every frame, honoring real per-frame delays.</text>

  <!-- 3 -->
  <text class="st" x="105" y="386">Encode</text>
  <text class="body" x="105" y="416">WebCodecs <tspan class="mono">VideoEncoder</tspan> + mediabunny produce H.264/MP4 or VP9/WebM in a Web Worker</text>
  <text class="body" x="105" y="442">(<tspan class="mono">@wordpress/video-conversion</tspan>, concurrency 1).</text>

  <!-- 4 -->
  <text class="st" x="105" y="492">Store as companion files</text>
  <text class="body" x="105" y="522">Video + first-frame poster are sideloaded onto the original GIF attachment</text>
  <text class="body" x="105" y="548">(<tspan class="mono">media_details.animated_video</tspan>) — the GIF remains a single <tspan class="mono">image/gif</tspan> attachment.</text>

  <!-- 5 -->
  <text class="st" x="105" y="598">Offer the block switch</text>
  <text class="body" x="105" y="628">"Display as video" on a standalone Image block switches it to the Video block's "GIF" variation</text>
  <text class="body" x="105" y="654">(<tspan class="mono">autoplay loop muted playsinline</tspan>). Reversible via "Display as GIF"; Gallery images are untouched.</text>
</svg>
