<h1 class="wp-block-heading">Math with LaTeX</h1>
<!-- /wp:heading -->

<!-- wp:paragraph -->
<p>The <strong>quadratic formula</strong> is <math data-latex="x = \frac{-b \pm \sqrt{b^2-4ac}}{2a}"></math> for any <math data-latex="ax^2 + bx + c = 0"></math>.</p>
<!-- /wp:paragraph -->

<!-- wp:paragraph -->
<p>Here is a display equation:</p>
<!-- /wp:paragraph -->

<!-- wp:math {"latex":"E = mc^2"} -->
<div class="wp-block-math"><math display="block"></math></div>
<!-- /wp:math -->

<!-- wp:paragraph -->
<p>Another paragraph with inline <math data-latex="\pi"></math> and <math data-latex="e"></math>.</p>
<!-- /wp:paragraph -->

<!-- wp:paragraph -->
<p>Display math with fractions:</p>
<!-- /wp:paragraph -->

<!-- wp:math {"latex":"\u005cfrac{a}{b} + \u005cfrac{c}{d}"} -->
<div class="wp-block-math"><math display="block"></math></div>
<!-- /wp:math -->

<!-- wp:paragraph -->
<p>Code blocks should not be converted: <code>$x^2$</code></p>
<!-- /wp:paragraph -->

<!-- wp:paragraph -->
<p>Currency like $100 should remain as text.</p>
<!-- /wp:paragraph -->

<!-- wp:paragraph -->
<p>Mixed inline: Given <math data-latex="a"></math> and <math data-latex="b"></math>, compute <math data-latex="a + b"></math>.</p>
<!-- /wp:paragraph -->
