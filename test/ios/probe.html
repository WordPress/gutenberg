<!doctype html><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>probe</title>
<style>body{font:18px/1.5 -apple-system,sans-serif;margin:16px}p{margin:0 0 6px;min-height:1.5em;border-left:3px solid #ddd;padding-left:6px}#status{position:fixed;left:0;right:0;bottom:0;background:#111;color:#fff;padding:8px 12px;font-size:16px}#ed{padding-bottom:60px}</style>
<div><a href="index.html">&larr; modes</a> &nbsp; <b id=modelabel></b></div>
<div id=ed></div>
<div id=status>tap a line, type a word, press return, type a word</div>
<script>
const q = new URLSearchParams(location.search); const mode = q.get('mode') || 'gb'; const pad = q.get('pad') || 'br'; const caret = q.get('caret') || 'before'; const fix = q.get('fix') || '';
document.getElementById('modelabel').textContent = mode + (pad !== 'br' ? ' + ' + pad : '') + (caret !== 'before' ? ' + caret ' + caret : '') + (fix ? ' + fix ' + fix : '');
const ed = document.getElementById('ed'); const status = document.getElementById('status');
let awaiting = false; let results = []; let keyinfo = ''; let caretinfo = ''; const descSel = () => { const s = getSelection(); const a = s.anchorNode; if (!a) return 'none'; return (a.nodeType === 3 ? '#text' + JSON.stringify(a.nodeValue.replace(/\uFEFF/g, '<FEFF>').replace(/\u200B/g, '<200B>')) : a.nodeName) + '@' + s.anchorOffset; }; const show = () => { status.textContent = 'caret ' + caretinfo + ' | ' + keyinfo + (results.length ? `  |  after return: ${results.join(' ')}` : ''); };
function beacon(){}
function makeP(){ const p = document.createElement('p'); if (mode !== 'native') { p.contentEditable = 'true'; p.setAttribute('role', 'textbox'); p.setAttribute('aria-label', 'line'); } p.appendChild(document.createTextNode('')); if (pad === 'zwnbsp') p.appendChild(document.createTextNode('﻿')); else if (pad === 'zwsp') p.appendChild(document.createTextNode('​')); else { const br = document.createElement('br'); br.setAttribute('data-pad',''); p.appendChild(br); } return p; }
function place(p){ p.focus(); const s = getSelection(); if (caret === 'after' && (pad === 'zwnbsp' || pad === 'zwsp')) { s.collapse(p.lastChild, 1); const before = () => s.collapse(p, 1); if (fix === 'sync') before(); else if (fix === 'micro') queueMicrotask(before); else if (fix === 'raf') requestAnimationFrame(before); else if (fix === 'timeout') setTimeout(before, 0); else if (fix === 'selchange') document.addEventListener('selectionchange', before, { once: true }); } else if (caret === 'inside' && (pad === 'zwnbsp' || pad === 'zwsp')) { s.collapse(p.lastChild, 0); } else if (caret === 'emptytext') { s.collapse(p.firstChild, 0); } else { s.collapse(p, Math.min(1, p.childNodes.length)); } }
function insertAfter(cur){ const p = makeP(); cur.after(p); return p; }
if (mode === 'native') { ed.contentEditable = 'true'; ed.setAttribute('role', 'textbox'); ed.setAttribute('aria-label', 'editor'); ed.appendChild(makeP()); }
else { ed.appendChild(makeP()); }
function curP(){ const s = getSelection(); const n = s.anchorNode; if (!n) return null; return (n.nodeType === 3 ? n.parentNode : n).closest('p'); }
document.addEventListener('keydown', (e) => {
  caretinfo = descSel(); show();
  if (e.key === 'Enter') { keyinfo = `keydown Enter shift=${e.shiftKey}`; show(); beacon({probe:'ioscap-keys', ev:'keydown', shift:e.shiftKey}); }
  if (e.key !== 'Enter' || mode === 'native' || mode === 'beforeinput') return;
  const cur = curP(); if (!cur) return; e.preventDefault(); awaiting = true;
  if (mode === 'gb') { place(insertAfter(cur)); }
  else if (mode === 'delay') { setTimeout(() => place(insertAfter(cur)), 0); }
  else if (mode === 'focusonly') { insertAfter(cur).focus(); }
}, true);
document.addEventListener('beforeinput', (e) => {
  if (e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak') { keyinfo += ` -> ${e.inputType}`; show(); beacon({probe:'ioscap-keys', ev:'beforeinput', inputType:e.inputType}); }
  if (mode === 'beforeinput' && e.inputType === 'insertParagraph') { const cur = curP(); if (!cur) return; e.preventDefault(); awaiting = true; place(insertAfter(cur)); }
  if (mode === 'native' && e.inputType === 'insertParagraph') { awaiting = true; }
}, true);
document.addEventListener('input', (e) => {
  if (!awaiting || !e.data || !/[a-zA-Z]/.test(e.data[0])) return;
  awaiting = false; const up = e.data[0] === e.data[0].toUpperCase();
  results.push(up ? 'U' : 'l'); show();
  beacon({first: e.data[0], upper: up});
}, true);
</script>
