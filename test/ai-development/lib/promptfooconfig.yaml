# Tracing configuration shared by every evaluation spec, pulled in with a JSON
# schema reference: `tracing: { $ref: lib/promptfooconfig.yaml#/tracing }`.
tracing:
    enabled: true
    failOnReceiverStartFailure: true
    # Claude calls its shell tool Bash, so declare it as a command tool name
    # for Promptfoo's trajectory steps to pick up.
    commandToolNames: ['Bash']
    otlp:
        http:
            enabled: true
            host: 127.0.0.1
            port: 4318
            acceptFormats: ['json']
