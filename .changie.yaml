changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
versionExt: md
versionFormat: '## {{.Version}} ({{.Time.Format "2006-01-02"}})'
kindFormat: '### {{.Kind}}'
changeFormat: '-   {{.Body}} ([#{{.Custom.PR}}](https://github.com/WordPress/gutenberg/pull/{{.Custom.PR}})).'
fragmentFileFormat: '{{.Project}}-{{.Custom.PR}}-{{.Kind}}-{{.Time.Format "20060102150405"}}'
envPrefix: 'GUTENBERG_'

newlines:
    afterChangelogHeader: 1
    beforeChangelogVersion: 1
    afterChangelogVersion: 1
    beforeVersion: 1
    afterVersion: 1
    beforeKind: 1
    afterKind: 1
    beforeChange: 0
    afterChange: 1
    endOfVersion: 1

custom:
    - key: PR
      label: Gutenberg Pull Request Number
      type: int
      minInt: 1

kinds:
    - label: Stable Release
      auto: '{{if eq .Env.PRE_1 "true"}}major{{else}}patch{{end}}'
    - label: Breaking Changes
      auto: '{{if eq .Env.PRE_1 "true"}}minor{{else}}major{{end}}'
    - label: New Features
      auto: minor
    - label: Enhancements
      auto: minor
    - label: Deprecations
      auto: minor
    - label: Bug Fixes
      auto: patch
    - label: Internal
      auto: patch
    - label: Documentation
      auto: patch

projects: []
