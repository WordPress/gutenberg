# Configure Dependabot scanning.
version: 2

updates:
    # Manage npm security updates only.
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'daily'
      # disables noisy npm *version* updates across the monorepo;
      # *security* updates ignore this limit and keep running.
      open-pull-requests-limit: 0
      labels:
          - 'dependencies'
          - '[Type] Build Tooling'

    # Manage npm security updates only for the AI development tests, which keep
    # their own lockfile outside the root workspaces.
    - package-ecosystem: 'npm'
      directory: '/test/ai-development'
      schedule:
          interval: 'daily'
      open-pull-requests-limit: 0
      labels:
          - 'dependencies'
          - '[Type] Build Tooling'
