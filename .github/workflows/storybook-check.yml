name: Storybook build and Smoke Tests

on:
    pull_request:
    push:
        branches:
            - trunk

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    check:
        runs-on: 'ubuntu-24.04'
        permissions:
            contents: read
        if: ${{ github.repository == 'WordPress/gutenberg' || github.event_name == 'pull_request' }}
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Setup Node.js and install dependencies
              uses: ./.github/setup-node

            - name: Build Storybook
              env:
                  NODE_OPTIONS: --max-old-space-size=8192
                  NODE_ENV: test
              run: npm run storybook:build

            # Regenerates the committed snapshot of components/props/descriptions
            # from the freshly built manifest. Fails if a component or prop is
            # newly missing a description (see the allowlist for known gaps).
            - name: Generate manifest snapshot
              run: npm run storybook:manifest-snapshot

            # Fails when the generated snapshot or pruned allowlist differs from
            # what's committed, surfacing documentation changes for sign-off.
            - name: Check manifest snapshot is up to date
              run: |
                  if ! git diff --exit-code -- storybook/components-manifest.yml storybook/prop-description-allowlist.json; then
                      echo "::error::The Storybook manifest snapshot is out of date. Review the diff above to confirm the change is expected, then run 'npm run storybook:build && npm run storybook:manifest-snapshot' locally and commit the updated storybook/components-manifest.yml and storybook/prop-description-allowlist.json."
                      exit 1
                  fi

            - name: Build E2E Storybook
              env:
                  NODE_ENV: test
              run: npm run storybook:e2e:build

            - name: Install test-runner and Playwright dependencies
              run: |
                  npm install --no-save @storybook/test-runner@0.24.2
                  npx playwright install --with-deps

            - name: Serve Storybook and run tests
              run: |
                  npx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
                  "npx http-server ./storybook/build --port 50240 --silent" \
                  "npx wait-on tcp:127.0.0.1:50240 && \
                  npx test-storybook --url http://localhost:50240 --config-dir ./storybook"
