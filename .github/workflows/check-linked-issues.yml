name: Check linked issues on Pull Request
on:
    pull_request_target: # zizmor: ignore[dangerous-triggers] Needs write access to comment on fork PRs; never checks out or runs PR code.
        types: [opened, edited, reopened, synchronize, ready_for_review]

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

# Serialize runs per PR so two quick events can't both post a comment.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
    check-linked-issues:
        name: Flag issue mentions that are not linked
        runs-on: 'ubuntu-24.04'
        if: ${{ github.event.pull_request.state == 'open' && github.repository == 'WordPress/gutenberg' }}
        permissions:
            issues: read
            pull-requests: write
        steps:
            - name: Detect unlinked issue mentions
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      // -----------------------------------------------------------------
                      // Step 1: Gather basic context about the pull request being checked.
                      // -----------------------------------------------------------------
                      const { owner, repo } = context.repo;
                      const pr = context.payload.pull_request;
                      const prNumber = pr.number;
                      const body = pr.body || '';

                      // -----------------------------------------------------------------
                      // Step 2: Normalise the PR body before parsing.
                      //
                      // HTML comments are stripped so placeholders like
                      // `Closes <!-- #ISSUE-NUMBER -->` in the PR template don't match
                      // as real issue references. Code blocks and inline code are
                      // stripped so values like `color: #333` aren't read as issues.
                      // -----------------------------------------------------------------
                      const visibleBody = body
                          .replace( /<!--[\s\S]*?-->/g, '' )
                          .replace( /^ {0,3}(`{3,}|~{3,})[\s\S]*?^ {0,3}\1/gm, '' )
                          .replace( /`[^`\n]*`/g, '' );

                      // -----------------------------------------------------------------
                      // Step 3: Extract every issue number mentioned in the description.
                      //
                      // Three forms are recognised:
                      //   - `#1234`              (short reference)
                      //   - `GH-1234`            (alternative short form)
                      //   - Full URLs to issues or pulls in this repo
                      //
                      // A reference is skipped when the phrase directly before it marks it
                      // as informational (e.g. "Related to #1", "Part of #2, #3", "See:
                      // #4"), since linking it would close that issue on merge. A
                      // WordPress core Trac ticket ("Trac #62345") is skipped too.
                      //
                      // Numbers are collected into a Set so duplicates collapse.
                      // -----------------------------------------------------------------
                      const referenced = new Set();

                      const informationalRegex =
                          /\b(?:related|relates|part of|see|follow[- ]?ups?|refs?|references?|cc|reverts?|similar|blocked by|depends on|alternative|supersedes|split from|extracted from|inspired by|builds? on)\b(?:\s+(?:to|of|on|in|by|from|for))?[\s:,-]*(?:issues?\s*)?(?:(?:GH-|#)\d+[\s,]*(?:and\s+|&\s+)?)*$/i;
                      const tracRegex = /\b(?:trac|core)(?:\s+ticket)?[\s:]*$/i;
                      const isInformational = ( index ) => {
                          const lineStart = visibleBody.lastIndexOf( '\n', index - 1 ) + 1;
                          const before = visibleBody.slice( lineStart, index );
                          return (
                              informationalRegex.test( before ) || tracRegex.test( before )
                          );
                      };

                      const collect = ( regex ) => {
                          let m;
                          while ( ( m = regex.exec( visibleBody ) ) ) {
                              // Skip the leading delimiter the short-form regex consumes.
                              const start = m.index + m[ 0 ].search( /GH-|#|https?:/i );
                              if ( ! isInformational( start ) ) {
                                  referenced.add( Number( m[ 1 ] ) );
                              }
                          }
                      };

                      collect( /(?:^|[^&\w])(?:GH-|#)(\d+)\b/gi );
                      collect(
                          new RegExp(
                              `https?://github\\.com/${ owner }/${ repo }/(?:issues|pull)/(\\d+)`,
                              'gi'
                          )
                      );

                      // The PR's own number can appear in URLs (e.g. a screenshot link)
                      // and is never an "issue mention" of itself.
                      referenced.delete( prNumber );

                      // -----------------------------------------------------------------
                      // Step 4: Look for an existing bot comment so we can update or
                      // remove it rather than posting a fresh comment on every run.
                      //
                      // A hidden HTML-comment marker uniquely identifies comments left
                      // by this workflow.
                      // -----------------------------------------------------------------
                      const marker = '<!-- check-linked-issues-bot -->';

                      const comments = await github.paginate(
                          github.rest.issues.listComments,
                          {
                              owner,
                              repo,
                              issue_number: prNumber,
                              per_page: 100,
                          }
                      );
                      const botComments = comments.filter(
                          ( c ) => c.body && c.body.includes( marker )
                      );
                      const existing = botComments[ 0 ];

                      const deleteComments = async ( list ) => {
                          for ( const comment of list ) {
                              await github.rest.issues.deleteComment( {
                                  owner,
                                  repo,
                                  comment_id: comment.id,
                              } );
                          }
                      };
                      const clearExistingComment = () =>
                          deleteComments( botComments.slice( 0, 1 ) );

                      // Remove duplicates left by earlier overlapping runs.
                      await deleteComments( botComments.slice( 1 ) );

                      // -----------------------------------------------------------------
                      // Step 5: Early-exit when the description mentions no issues.
                      //
                      // If a previous run left a comment, clear it now so the thread
                      // reflects the current state of the PR body.
                      // -----------------------------------------------------------------
                      if ( referenced.size === 0 ) {
                          core.info( 'No issue references detected in PR body.' );
                          await clearExistingComment();
                          return;
                      }

                      // -----------------------------------------------------------------
                      // Step 6: Ask GraphQL which issues GitHub considers "linked".
                      //
                      // `closingIssuesReferences` is the exact set of issues that power
                      // the *Development* section of the right sidebar — populated
                      // either by closing keywords in the body or by manual linking
                      // via the UI. It can include issues from other repositories, so
                      // only this repository's issues count.
                      // -----------------------------------------------------------------
                      const linkedQuery = `
                          query($owner: String!, $repo: String!, $number: Int!) {
                              repository(owner: $owner, name: $repo) {
                                  pullRequest(number: $number) {
                                      closingIssuesReferences(first: 100) {
                                          nodes { number repository { nameWithOwner } }
                                      }
                                  }
                              }
                          }
                      `;
                      const fullName = `${ owner }/${ repo }`.toLowerCase();
                      const fetchLinked = async () => {
                          const result = await github.graphql( linkedQuery, {
                              owner,
                              repo,
                              number: prNumber,
                          } );
                          return new Set(
                              (
                                  result.repository.pullRequest.closingIssuesReferences
                                      .nodes || []
                              )
                                  .filter(
                                      ( n ) =>
                                          n.repository.nameWithOwner.toLowerCase() ===
                                          fullName
                                  )
                                  .map( ( n ) => n.number )
                          );
                      };
                      const candidatesFrom = ( linked ) =>
                          [ ...referenced ].filter( ( n ) => ! linked.has( n ) );

                      let candidates = candidatesFrom( await fetchLinked() );

                      // GitHub resolves closing keywords asynchronously, so a keyword
                      // added in this very edit may not be linked yet. Check once more.
                      if ( candidates.length > 0 ) {
                          await new Promise( ( resolve ) => setTimeout( resolve, 10000 ) );
                          candidates = candidatesFrom( await fetchLinked() );
                      }

                      // -----------------------------------------------------------------
                      // Step 7: Reduce the candidates to real issues in this repository.
                      //
                      // One batched query drops numbers that are pull requests or that
                      // don't exist (stale references that happen to match `#N`).
                      // -----------------------------------------------------------------
                      let unlinked = [];
                      if ( candidates.length > 0 ) {
                          const fields = candidates
                              .map(
                                  ( n ) =>
                                      `n${ n }: issueOrPullRequest(number: ${ n }) { __typename }`
                              )
                              .join( '\n' );
                          const typesQuery = `
                              query($owner: String!, $repo: String!) {
                                  repository(owner: $owner, name: $repo) { ${ fields } }
                              }
                          `;
                          let data;
                          try {
                              data = await github.graphql( typesQuery, { owner, repo } );
                          } catch ( err ) {
                              // A missing number fails only its own field; keep the rest.
                              if ( ! err.data ) {
                                  throw err;
                              }
                              data = err.data;
                          }
                          unlinked = candidates.filter(
                              ( n ) => data.repository?.[ `n${ n }` ]?.__typename === 'Issue'
                          );
                      }

                      // -----------------------------------------------------------------
                      // Step 8: Everything is linked — clean up and finish.
                      // -----------------------------------------------------------------
                      if ( unlinked.length === 0 ) {
                          core.info(
                              'All referenced issues are linked via the Development field.'
                          );
                          await clearExistingComment();
                          return;
                      }

                      // -----------------------------------------------------------------
                      // Step 9: Build the advisory comment body listing unlinked issues
                      // and explaining the two ways to resolve the notice.
                      // -----------------------------------------------------------------
                      const list = unlinked
                          .sort( ( a, b ) => a - b )
                          .map( ( n ) => `- #${ n }` )
                          .join( '\n' );

                      const message = [
                          marker,
                          '### Linked issues check',
                          '',
                          "The following issue(s) are mentioned in this PR's description but are **not linked** in the *Development* section of the right sidebar:",
                          '',
                          list,
                          '',
                          'Release leads and folks writing release notes rely on the *Development* relationship to find every PR associated with a ticket. To link an issue, please either:',
                          '',
                          '- Replace the mention with a closing keyword in the PR description (e.g. `Closes #1234`, `Fixes #1234`, or `Resolves #1234`), **or**',
                          '- Manually link the issue from the *Development* section on the right sidebar of this PR. GitHub does not re-run this check for sidebar changes, so this notice updates on the next push or description edit.',
                          '',
                          '> [!WARNING]',
                          '> Either way, GitHub closes a linked issue when this PR is merged. Only link issues this PR fully resolves.',
                          '',
                          'If a reference is informational, no action is needed. Prefixing it with a phrase like *Related to*, *Part of*, or *See* on the same line clears this notice. This check is advisory and will not block the PR.',
                      ].join( '\n' );

                      // -----------------------------------------------------------------
                      // Step 10: Post a new comment or update the existing one in place.
                      // An update is skipped when the body hasn't changed to avoid
                      // needless notifications on every PR edit.
                      // -----------------------------------------------------------------
                      if ( existing ) {
                          if ( existing.body !== message ) {
                              await github.rest.issues.updateComment( {
                                  owner,
                                  repo,
                                  comment_id: existing.id,
                                  body: message,
                              } );
                          }
                      } else {
                          await github.rest.issues.createComment( {
                              owner,
                              repo,
                              issue_number: prNumber,
                              body: message,
                          } );
                      }

                      // Surface the detection in the Actions log as a warning so it's
                      // visible in the checks UI without failing the run.
                      core.warning(
                          `Unlinked issue mentions detected: ${ unlinked
                              .map( ( n ) => `#${ n }` )
                              .join( ', ' ) }`
                      );
