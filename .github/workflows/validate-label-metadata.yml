name: Validate GitHub label metadata

# Keep authenticated API access out of pull request checks. The local static
# check validates the configuration; this trusted workflow audits GitHub.

on:
    schedule:
        - cron: '0 8 * * 1'
    workflow_dispatch:

# Disable permissions for all available scopes by default.
permissions: {}

jobs:
    validate:
        name: Validate package and tool labels
        if: ${{ github.repository == 'WordPress/gutenberg' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
            issues: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Use desired version of Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Pin npm version for consistency
              run: |
                  npm install --global npm@10
                  npm --version

            - name: npm install
              run: npm install

            - name: Validate GitHub label metadata
              run: npm run lint:labeler-config -- --github-repository "$GITHUB_REPOSITORY"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
