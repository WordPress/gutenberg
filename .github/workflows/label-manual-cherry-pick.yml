name: Label Manual Cherry-Pick

on:
    pull_request_target:
        types: [closed]
        branches:
            - 'wp/**'
            - 'release/**'

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    label-original-pr:
        runs-on: 'ubuntu-24.04'
        permissions:
            contents: read
            pull-requests: write
        if: >
            github.event.pull_request.merged == true &&
            github.repository == 'WordPress/gutenberg'
        steps:
            - name: Detect cherry-pick and label original PR
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
              with:
                  script: |
                      const pr = context.payload.pull_request;
                      const title = pr.title || '';
                      const body = pr.body || '';
                      const text = `${title}\n${body}`;
                      const { owner, repo } = context.repo;
                      const prNumbers = new Set();

                      // 1. Look for explicit cherry-pick references in PR title/body.
                      //    Matches patterns like:
                      //    - "cherry-pick of #12345"
                      //    - "cherry-picked from #12345"
                      //    - "cherry pick #12345"
                      const cherryPickRefRegex = /cherry[- ]?pick(?:ed)?(?:\s+(?:of|from))?\s+#(\d+)/gi;
                      let match;
                      while ((match = cherryPickRefRegex.exec(text)) !== null) {
                          prNumbers.add(parseInt(match[1], 10));
                      }

                      // 2. Look for GitHub PR URL references in cherry-pick context.
                      //    Matches: "cherry-picked from https://github.com/WordPress/gutenberg/pull/12345"
                      const cherryPickUrlRegex = /cherry[- ]?pick(?:ed)?(?:\s+(?:of|from))?\s+https?:\/\/github\.com\/WordPress\/gutenberg\/pull\/(\d+)/gi;
                      while ((match = cherryPickUrlRegex.exec(text)) !== null) {
                          prNumbers.add(parseInt(match[1], 10));
                      }

                      // 3. Detect git's automatic "(cherry picked from commit <SHA>)" message
                      //    in the merge commit, and resolve the SHA to the original PR.
                      const mergeCommitSha = pr.merge_commit_sha;
                      if (mergeCommitSha) {
                          try {
                              const { data: commitData } = await github.rest.git.getCommit({
                                  owner,
                                  repo,
                                  commit_sha: mergeCommitSha,
                              });
                              const commitMessage = commitData.message || '';

                              // Git adds "(cherry picked from commit <SHA>)" automatically.
                              const gitCherryPickRegex = /\(cherry picked from commit ([a-f0-9]+)\)/gi;
                              const shaMatches = [];
                              while ((match = gitCherryPickRegex.exec(commitMessage)) !== null) {
                                  shaMatches.push(match[1]);
                              }

                              // Also check the squashed commit message for PR number pattern (#12345).
                              const prRefInCommitRegex = /\(#(\d+)\)/gm;
                              while ((match = prRefInCommitRegex.exec(commitMessage)) !== null) {
                                  prNumbers.add(parseInt(match[1], 10));
                              }

                              // Resolve each cherry-picked SHA to its associated PR.
                              for (const sha of shaMatches) {
                                  try {
                                      const { data: associatedPrs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                                          owner,
                                          repo,
                                          commit_sha: sha,
                                      });
                                      for (const associatedPr of associatedPrs) {
                                          if (associatedPr.base.ref === 'trunk' && associatedPr.merged_at) {
                                              prNumbers.add(associatedPr.number);
                                          }
                                      }
                                  } catch (error) {
                                      console.log(`Could not resolve commit ${sha}: ${error.message}`);
                                  }
                              }
                          } catch (error) {
                              console.log(`Could not fetch merge commit ${mergeCommitSha}: ${error.message}`);
                          }
                      }

                      if (prNumbers.size === 0) {
                          console.log('No original PR references found. Skipping.');
                          return;
                      }

                      const label = 'Backported to WP Core';
                      for (const originalPrNumber of prNumbers) {
                          // Skip self-references.
                          if (originalPrNumber === pr.number) {
                              continue;
                          }

                          try {
                              const { data: originalPr } = await github.rest.pulls.get({
                                  owner,
                                  repo,
                                  pull_number: originalPrNumber,
                              });

                              // Only label PRs that target trunk.
                              if (originalPr.base.ref !== 'trunk') {
                                  console.log(`PR #${originalPrNumber} does not target trunk. Skipping.`);
                                  continue;
                              }

                              // Check if the label already exists.
                              const existingLabels = originalPr.labels.map(l => l.name);
                              if (existingLabels.includes(label)) {
                                  console.log(`PR #${originalPrNumber} already has "${label}" label. Skipping.`);
                                  continue;
                              }

                              await github.rest.issues.addLabels({
                                  owner,
                                  repo,
                                  issue_number: originalPrNumber,
                                  labels: [label],
                              });
                              console.log(`Added "${label}" label to PR #${originalPrNumber}.`);
                          } catch (error) {
                              console.log(`Could not process PR #${originalPrNumber}: ${error.message}`);
                          }
                      }
