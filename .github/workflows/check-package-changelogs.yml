name: Verify package CHANGELOG updates

on:
    pull_request:
        types: [opened, synchronize]
        branches:
            - trunk
        paths:
            - 'packages/admin-ui/**'
            - 'packages/babel-plugin-import-jsx-pragma/**'
            - 'packages/babel-plugin-makepot/**'
            - 'packages/babel-preset-default/**'
            - 'packages/browserslist-config/**'
            - 'packages/components/**'
            - 'packages/create-block/**'
            - 'packages/create-block-interactive-template/**'
            - 'packages/create-block-tutorial-template/**'
            - 'packages/dataviews/**'
            - 'packages/dependency-extraction-webpack-plugin/**'
            - 'packages/docgen/**'
            - 'packages/e2e-test-utils-playwright/**'
            - 'packages/env/**'
            - 'packages/eslint-plugin/**'
            - 'packages/fields/**'
            - 'packages/grid/**'
            - 'packages/icons/**'
            - 'packages/interface/**'
            - 'packages/npm-package-json-lint-config/**'
            - 'packages/postcss-plugins-preset/**'
            - 'packages/postcss-themes/**'
            - 'packages/prettier-config/**'
            - 'packages/private-apis/**'
            - 'packages/readable-js-assets-webpack-plugin/**'
            - 'packages/scripts/**'
            - 'packages/style-runtime/**'
            - 'packages/stylelint-config/**'
            - 'packages/theme/**'
            - 'packages/theme-build-tools/**'
            - 'packages/ui/**'
            - 'packages/undo-manager/**'
            - 'packages/views/**'
            - 'packages/widget-dashboard/**'
            - 'packages/widget-primitives/**'
            - 'packages/wp-build/**'
            - '!packages/*/**/*.md'
            - 'packages/*/CHANGELOG.md'
            - 'tools/validation/validate-changelogs.ts'
            - '.github/workflows/check-package-changelogs.yml'
            - '!packages/*/**/stories/**'
            - '!packages/*/**/test/**'
            - '!packages/*/**/__tests__/**'
            - '!packages/*/**/*.stories.*'
            - '!packages/*/**/*.mdx'
            - '!packages/*/**/storybook.d.ts'
            - '!packages/*/tsconfig.stories.json'
            - '!packages/*/tsconfig.test.json'
            - '!packages/*/tsconfig.bin.json'
            - '!packages/*/.stylelintrc*'
            - '!packages/*/.eslintrc*'
            - '!packages/*/.prettierrc*'
            - '!packages/*/.gitignore'

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    # Lists the allowlisted packages with relevant changes.
    changed-packages:
        name: Find packages that need a CHANGELOG entry
        runs-on: 'ubuntu-slim'
        permissions:
            contents: read
        outputs:
            packages: ${{ steps.filter.outputs.packages }}
        steps:
            - name: 'Get PR commit count'
              env:
                  PR_COUNT: ${{ github.event.pull_request.commits }}
              run: echo "PR_COMMIT_COUNT=$(( PR_COUNT + 1 ))" >> "${GITHUB_ENV}"
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  fetch-depth: ${{ env.PR_COMMIT_COUNT }}
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false
            - name: 'Fetch relevant history from base repository'
              run: git fetch "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_BASE_REF"
            - name: List packages with relevant changes
              id: filter
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  # These packages have stricter expectations around changes
                  # having an accompanying changelog note.
                  packages=(
                      # Bundled packages
                      # Keep in sync with dependency-extraction-webpack-plugin
                      admin-ui
                      dataviews
                      fields
                      grid
                      icons
                      interface
                      style-runtime
                      ui
                      undo-manager
                      views
                      # Other packages
                      theme
                      components
                      private-apis
                      widget-dashboard
                      widget-primitives
                      wp-build
                      # Tooling and config packages published to npm
                      babel-plugin-import-jsx-pragma
                      babel-plugin-makepot
                      babel-preset-default
                      browserslist-config
                      create-block
                      create-block-interactive-template
                      create-block-tutorial-template
                      dependency-extraction-webpack-plugin
                      docgen
                      e2e-test-utils-playwright
                      env
                      eslint-plugin
                      npm-package-json-lint-config
                      postcss-plugins-preset
                      postcss-themes
                      prettier-config
                      readable-js-assets-webpack-plugin
                      scripts
                      stylelint-config
                      theme-build-tools
                  )

                  # Files that don't warrant a CHANGELOG entry:
                  ignored="^packages/[^/]+/("
                  # Tests and stories.
                  ignored+="(.+/)?(stories|test|__tests__)/"
                  # Markdown: docs, READMEs and the CHANGELOG itself.
                  ignored+="|.+\.(md|mdx)$"
                  # Storybook files outside a stories directory.
                  ignored+="|(.+/)?([^/]+\.stories\.[^/]+|storybook\.d\.ts)$"
                  # Dev tooling configs at the package root. Configs a package
                  # ships, such as `packages/scripts/config/`, and TypeScript
                  # configs that can affect the build (`tsconfig.json`,
                  # `tsconfig.build.json`, `tsconfig.prebuilt.json`) still count.
                  ignored+="|(tsconfig\.(stories|test|bin)\.json|\.(stylelintrc|eslintrc|prettierrc)[^/]*|\.gitignore)$"
                  ignored+=")"

                  relevant_changes=$(git diff --name-only --no-renames "$BASE_SHA"...HEAD -- packages/ \
                      | grep -Ev "$ignored" || true)

                  # RUNNER_DEBUG is 1 when the run has debug logging enabled.
                  if [[ "${RUNNER_DEBUG:-}" == 1 ]]; then
                      echo "Changed files under packages/ that count toward a CHANGELOG entry:"
                      echo "${relevant_changes:-none}"
                  fi

                  changed=()
                  for package in "${packages[@]}"; do
                      if grep -q "^packages/${package}/" <<< "$relevant_changes"; then
                          changed+=( "$package" )
                      fi
                  done

                  echo "packages=$(jq --compact-output --null-input '$ARGS.positional' --args "${changed[@]}")" >> "$GITHUB_OUTPUT"

    # Presence: Each package with relevant changes needs a changelog note
    # citing this pull request.
    presence:
        # GitHub appends the package to each matrix job's name. A skipped job
        # shows the name as written, so it must not use the `matrix` context.
        name: Check CHANGELOG presence
        needs: changed-packages
        # A matrix with no values fails the run, so skip the job instead.
        if: ${{ needs.changed-packages.outputs.packages != '[]' }}
        runs-on: 'ubuntu-slim'
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                package: ${{ fromJSON( needs.changed-packages.outputs.packages ) }}
        steps:
            - name: 'Get PR commit count'
              env:
                  PR_COUNT: ${{ github.event.pull_request.commits }}
              run: echo "PR_COMMIT_COUNT=$(( PR_COUNT + 1 ))" >> "${GITHUB_ENV}"
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  fetch-depth: ${{ env.PR_COMMIT_COUNT }}
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false
            - name: 'Fetch relevant history from base repository'
              run: git fetch "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_BASE_REF"
            - name: Setup Node.js and install dependencies
              uses: ./.github/setup-node
            - name: Check CHANGELOG cites this PR
              env:
                  PR_NUMBER: ${{ github.event.number }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PACKAGE_PATH: packages/${{ matrix.package }}
                  PACKAGE_NAME: ${{ matrix.package }}
              run: |
                  changelog_path="${PACKAGE_PATH}/CHANGELOG.md"
                  optional_check_notice="This isn't a required check, so if you think your changes are small enough that they don't warrant a CHANGELOG entry, please go ahead and merge without one."

                  # If package is using Changie fragments
                  is_changie=$(node -e "import('./tools/changelogs/lib/config.ts').then(m => console.log(m.isChangiePackage('${PACKAGE_NAME}') ? 'true' : 'false'))")

                  if [ "$is_changie" = "true" ]; then
                      # Check if any .changes/unreleased fragment was added/modified for this PR and package
                      changed_fragments=$(git diff --name-only "$BASE_SHA"...HEAD -- ".changes/unreleased/*__${PACKAGE_NAME}__*.yaml" || true)
                      if [ -z "$changed_fragments" ]; then
                          echo "Please add a changelog fragment via 'npm run changelog:add -- -j ${PACKAGE_NAME}'"
                          echo
                          echo "${optional_check_notice}"
                          exit 1
                      fi
                      npm run lint:changelogs -- --require-pr="${PR_NUMBER}" "${changelog_path}"
                  else
                      # Fail if the PR doesn't touch the changelog
                      if git diff --quiet "$BASE_SHA"...HEAD -- "$changelog_path"; then
                          echo "Please add a CHANGELOG entry to $changelog_path"
                          echo
                          echo "${optional_check_notice}"
                          exit 1
                      fi

                      # Confirm that the CHANGELOG has a valid entry for the current PR
                      npm run lint:changelogs -- --require-pr="${PR_NUMBER}" "${changelog_path}"
                  fi

    # Structure: For any revisions to CHANGELOGs (regardless of package),
    # validate that the contents follow the expected format.
    structure:
        name: Validate CHANGELOG structure
        runs-on: 'ubuntu-slim'
        permissions:
            contents: read
        steps:
            - name: 'Get PR commit count'
              env:
                  PR_COUNT: ${{ github.event.pull_request.commits }}
              run: echo "PR_COMMIT_COUNT=$(( PR_COUNT + 1 ))" >> "${GITHUB_ENV}"
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  fetch-depth: ${{ env.PR_COMMIT_COUNT }}
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false
            - name: 'Fetch relevant history from base repository'
              run: git fetch "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_BASE_REF"
            - name: Setup Node.js and install dependencies
              uses: ./.github/setup-node
            - name: Validate touched CHANGELOG files
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_NUMBER: ${{ github.event.number }}
              run: |
                  changelogs=$(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD -- 'packages/*/CHANGELOG.md')
                  fragments=$(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD -- '.changes/unreleased/*.yaml')

                  if [ -z "$changelogs" ] && [ -z "$fragments" ]; then
                      echo "No package CHANGELOG.md or Changie fragment files changed; skipping structure check."
                      exit 0
                  fi

                  if [ -n "$changelogs" ]; then
                      echo "Validating CHANGELOG files:"
                      echo "$changelogs"
                      echo "$changelogs" | xargs npm run lint:changelogs -- --pr="${PR_NUMBER}"
                  fi

                  if [ -n "$fragments" ]; then
                      echo "Validating fragments:"
                      echo "$fragments"
                      npm run lint:changelogs -- --pr="${PR_NUMBER}"
                  fi
