name: Verify package CHANGELOG updates

on:
    pull_request:
        types: [opened, synchronize]
        branches:
            - trunk
        paths:
            - 'packages/**'
            - 'tools/validation/validate-changelogs.ts'
            - '.github/workflows/check-package-changelogs.yml'
            - '!packages/*/src/**/stories/**'
            - '!packages/**/test/**'
            - '!packages/**/tests/**'
            - '!packages/**/__tests__/**'
            - '!packages/**/__snapshots__/**'
            - '!packages/**/__mocks__/**'
            - '!packages/**/*.test.*'
            - '!packages/**/*.spec.*'
            - '!packages/**/*.md'
            - '!packages/*/tsconfig*.json'
            - '!packages/*/.*rc'
            - '!packages/*/.*rc.*'
            - '!packages/*/.gitignore'
            - '!packages/*/eslint.config.*'
            - '!packages/*/eslint-overrides.*'
            # Keep CHANGELOG edits triggering the structure check below.
            - 'packages/*/CHANGELOG.md'

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    # Presence: Every published (non-private) package changed by a pull
    # request must have an accompanying CHANGELOG entry citing the PR.
    presence:
        name: Check CHANGELOG presence
        runs-on: 'ubuntu-24.04'
        permissions:
            contents: read
        steps:
            - name: 'Get PR commit count'
              env:
                  PR_COUNT: ${{ github.event.pull_request.commits }}
              run: echo "PR_COMMIT_COUNT=$(( PR_COUNT + 1 ))" >> "${GITHUB_ENV}"
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  fetch-depth: ${{ env.PR_COMMIT_COUNT }}
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false
            - name: 'Fetch relevant history from base repository'
              run: git fetch "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_BASE_REF"
            - name: Determine which packages have relevant changes
              id: filter
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  # Changes to stories, tests (test directories, snapshots,
                  # mocks, and *.test.* / *.spec.* files), Markdown files
                  # (including the CHANGELOG itself), and development config
                  # (tsconfig and ESLint config files, top-level tool rc files,
                  # and .gitignore)
                  # don't need an entry. Private packages aren't published to npm, so
                  # they're skipped, as are packages removed by the PR.
                  packages=$(git diff --name-only "$BASE_SHA"...HEAD -- 'packages/' \
                      | grep -Ev '^packages/[^/]+/(src/(.+/)?stories/|(.+/)?(test|tests|__tests__|__snapshots__|__mocks__)/|.*\.(test|spec)\.[^/]+$|.*\.md$|tsconfig[^/]*\.json$|eslint(\.config|-overrides)\.[^/]+$|\.([^/]*rc(\.[^/]+)?|gitignore)$)' \
                      | cut -d/ -f2 \
                      | sort -u \
                      | while read -r package; do
                          manifest="packages/${package}/package.json"
                          if [ ! -f "$manifest" ]; then
                              echo "packages/${package} has no package.json; skipping." >&2
                          elif [ "$(jq -r '.private // false' "$manifest")" = 'true' ]; then
                              echo "packages/${package} is private; skipping." >&2
                          else
                              echo "$package"
                          fi
                      done)

                  if [ -z "$packages" ]; then
                      echo "No relevant package changes; skipping CHANGELOG presence check."
                  else
                      echo "Packages with relevant changes:"
                      echo "$packages"
                  fi

                  {
                      echo 'packages<<EOF'
                      echo "$packages"
                      echo 'EOF'
                  } >> "$GITHUB_OUTPUT"
            # This intentionally doesn't use `.github/setup-node`, because we
            # don't currently need to `npm ci` install any dependencies.
            - name: Use desired version of Node.js
              if: steps.filter.outputs.packages != ''
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: '.nvmrc'
                  package-manager-cache: false
            - name: Set up npm
              if: steps.filter.outputs.packages != ''
              uses: ./.github/setup-npm
              with:
                  cache: false
            - name: Check CHANGELOGs cite this PR
              if: steps.filter.outputs.packages != ''
              env:
                  PR_NUMBER: ${{ github.event.number }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PACKAGES: ${{ steps.filter.outputs.packages }}
              run: |
                  missing=()
                  changelogs=()
                  while read -r package; do
                      changelog_path="packages/${package}/CHANGELOG.md"
                      if git diff --quiet "$BASE_SHA"...HEAD -- "$changelog_path"; then
                          missing+=( "$changelog_path" )
                      else
                          changelogs+=( "$changelog_path" )
                      fi
                  done <<< "$PACKAGES"

                  status=0

                  if [ "${#missing[@]}" -gt 0 ]; then
                      echo "Please add a CHANGELOG entry citing this pull request to:"
                      printf '  %s\n' "${missing[@]}"
                      echo
                      echo "See https://github.com/WordPress/gutenberg/tree/HEAD/packages#maintaining-changelogs"
                      echo
                      echo "This isn't a required check, so if you think your changes are small enough that they don't warrant a CHANGELOG entry, please go ahead and merge without one."
                      status=1
                  fi

                  # Confirm that each touched CHANGELOG has a valid entry for the current PR
                  if [ "${#changelogs[@]}" -gt 0 ]; then
                      npm run lint:changelogs -- --require-pr="${PR_NUMBER}" "${changelogs[@]}" || status=1
                  fi

                  exit "$status"

    # Structure: For any revisions to CHANGELOGs (regardless of package),
    # validate that the contents follow the expected format.
    structure:
        name: Validate CHANGELOG structure
        runs-on: 'ubuntu-24.04'
        permissions:
            contents: read
        steps:
            - name: 'Get PR commit count'
              env:
                  PR_COUNT: ${{ github.event.pull_request.commits }}
              run: echo "PR_COMMIT_COUNT=$(( PR_COUNT + 1 ))" >> "${GITHUB_ENV}"
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  fetch-depth: ${{ env.PR_COMMIT_COUNT }}
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false
            - name: 'Fetch relevant history from base repository'
              run: git fetch "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_BASE_REF"
            # This intentionally doesn't use `.github/setup-node`, because we
            # don't currently need to `npm ci` install any dependencies.
            - name: Use desired version of Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: '.nvmrc'
                  package-manager-cache: false
            - name: Set up npm
              uses: ./.github/setup-npm
              with:
                  cache: false
            - name: Validate touched CHANGELOG files
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_NUMBER: ${{ github.event.number }}
              run: |
                  changelogs=$(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD -- 'packages/*/CHANGELOG.md')

                  if [ -z "$changelogs" ]; then
                      echo "No package CHANGELOG.md files changed; skipping structure check."
                      exit 0
                  fi

                  echo "Validating:"
                  echo "$changelogs"
                  echo "$changelogs" | xargs npm run lint:changelogs -- --pr="${PR_NUMBER}"
