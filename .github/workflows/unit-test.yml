name: Unit Tests

on:
  pull_request:
    paths-ignore:
    - '**.md'
  push:
    branches:
      - trunk
      - 'release/[0-9]+.[0-9]'
      - 'wp/[0-9]+.[0-9]'
      - wp/latest
      - wp/next
    paths-ignore:
    - '**.md'

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
  unit-js:
    name: JavaScript
    runs-on: 'ubuntu-24.04'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache node modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'

    - name: Npm install and build
      # It's not necessary to run the full build, since Jest can interpret
      # source files with `babel-jest`. Some packages have their own custom
      # build tasks, however. These must be run.
      run: |
        npm ci
        npx lerna run build

    - name: Running the tests
      run: npm run test-unit -- --ci --maxWorkers=2 --cacheDirectory="$HOME/.jest-cache"

    - name: Running the date tests
      run: npm run test-unit:date -- --ci --maxWorkers=2 --cacheDirectory="$HOME/.jest-cache"

  unit-php:
    name: PHP ${{ matrix.php }}${{ matrix.multisite && ' multisite' || '' }}

    runs-on: 'ubuntu-24.04'
    timeout-minutes: 20

    strategy:
      fail-fast: true
      matrix:
        php:
          - '5.6'
          - '7.0'
          - '7.4'
          - '8.0'
        multisite: [false, true]

    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache node modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'

    - name: Npm install and build
      run: |
        npm ci
        npm run build

    - name: Install WordPress
      run: |
        chmod -R 767 ./ # TODO: Possibly integrate in wp-env
        npm run wp-env start

    # PHP 5.6 and 7.0 run the PHPUnit bundled in their `phpunit` image, but the
    # test bootstrap still loads `vendor/autoload.php`, and they can't parse the
    # locked `phpunit/phpunit`, which needs a newer PHP. Removing it isn't
    # enough once other packages require it, so these versions swap it for the
    # newest release they support.
    - name: Install a PHPUnit release this PHP version can load
      if: ${{ matrix.php == '5.6' || matrix.php == '7.0' }}
      env:
        PLATFORM_PHP: ${{ matrix.php == '5.6' && '5.6.20' || '7.0.33' }}
        PHPUNIT_VERSION: ${{ matrix.php == '5.6' && '^5.7.21' || '^6.5' }}
      run: |
        npm run wp-env run composer "config platform.php $PLATFORM_PHP"
        npm run wp-env run composer "require --dev phpunit/phpunit:$PHPUNIT_VERSION --with-all-dependencies --no-interaction"

    - name: Running lint check
      run: npm run lint-php

    - name: Running single site unit tests
      run: npm run test-unit-php
      if: ${{ ! matrix.multisite }}

    - name: Running multisite unit tests
      run: npm run test-unit-php-multisite
      if: ${{ matrix.multisite }}
