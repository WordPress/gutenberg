name: Unit Tests

on:
  pull_request:
  push:
    branches:
    - trunk
    - 'release/[0-9]+.[0-9]'
    - 'wp/[0-9]+.[0-9]'
    - wp/latest
    - wp/next

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
  unit-js:
    name: JavaScript

    runs-on: 'ubuntu-24.04'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache node modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'

    - name: Npm install and build
      # It's not necessary to run the full build, since Jest can interpret
      # source files with `babel-jest`. Some packages have their own custom
      # build tasks, however. These must be run.
      run: |
        npm ci
        npx lerna run build

    - name: Running the tests
      run: npm run test-unit -- --ci --maxWorkers=2 --cacheDirectory="$HOME/.jest-cache"

  unit-php:
    name: PHP ${{ matrix.php }}${{ matrix.multisite && ' multisite' || '' }}

    runs-on: 'ubuntu-24.04'
    timeout-minutes: 20

    strategy:
      # Don't let one PHP version's failure cancel the others -- each leg is
      # independently useful signal, especially the first time some of these
      # versions are tested in isolation on this branch.
      fail-fast: false
      matrix:
        php: ['5.6', '7.0', '7.4']
        multisite: [false, true]

    env:
      # This branch's wp-env can't set a PHP version, so pick the `phpunit` service's image
      # directly. `wp-env run phpunit` passes this variable through to Docker Compose.
      LOCAL_PHP: ${{ matrix.php }}-fpm

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache node modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'

    - name: Npm install and build
      run: |
        npm ci
        npm run build

    - name: Install WordPress
      run: |
        echo '{ "config": { "SCRIPT_DEBUG": false, "WP_PHP_BINARY": "php", "WP_TESTS_EMAIL": "admin@example.org", "WP_TESTS_TITLE": "Test Blog" } }' > .wp-env.override.json
        chmod -R 767 ./ # TODO: Possibly integrate in wp-env
        npm run wp-env start

    - name: Install Composer dependencies
      run: npm run wp-env run composer 'install --no-interaction'

    - name: Running the tests (single site)
      if: ${{ ! matrix.multisite }}
      run: npm run test-php

    - name: Running the tests (multisite)
      if: ${{ matrix.multisite }}
      run: npm run test-unit-php-multisite

  phpcs:
    name: PHP coding standards

    runs-on: 'ubuntu-24.04'
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # This branch's PHP_CodeSniffer and WPCS releases fail on PHP 8.4+, so stay on 7.4 until they're upgraded.
    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
      with:
        php-version: '7.4'
        coverage: none
        tools: cs2pr

    # This date is used to ensure that the PHPCS cache is cleared at least once every week.
    # http://man7.org/linux/man-pages/man1/date.1.html
    - name: "Get last Monday's date"
      id: get-date
      run: echo "date=$(/bin/date -u --date='last Mon' "+%F")" >> $GITHUB_OUTPUT

    - name: Cache PHPCS scan cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/phpcs.json
        key: ${{ runner.os }}-date-${{ steps.get-date.outputs.date }}-phpcs-cache-${{ hashFiles('**/composer.json', 'phpcs.xml.dist') }}

    # Passing a custom cache suffix ensures that the cache is flushed at least once per week.
    - name: Install Composer dependencies
      uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
      with:
        custom-cache-suffix: ${{ steps.get-date.outputs.date }}

    - name: Make Composer packages available globally
      run: echo "${PWD}/vendor/bin" >> $GITHUB_PATH

    # `--runtime-set ignore_warnings_on_exit 1` matches this branch's own
    # `composer run-script lint`, which the removed in-container step ran.
    - name: Run PHPCS on all Gutenberg files
      id: phpcs-gutenberg
      run: phpcs --runtime-set ignore_warnings_on_exit 1 --report-full --report-checkstyle=./.cache/phpcs-report.xml

    - name: Show PHPCS results in PR
      if: ${{ always() && steps.phpcs-gutenberg.outcome == 'failure' }}
      run: cs2pr ./.cache/phpcs-report.xml
