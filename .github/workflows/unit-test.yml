name: Unit Tests

on:
    pull_request:
    push:
        branches:
            - trunk
            - 'release/[0-9]+.[0-9]'
            - 'wp/[0-9]+.[0-9]'
            - wp/latest
            - wp/next
    # Allow manually triggering the workflow.
    workflow_dispatch:

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    unit-js:
        name: JavaScript
        runs-on: 'ubuntu-24.04'
        permissions:
            contents: read
        if: ${{ github.repository == 'WordPress/gutenberg' || github.event_name == 'pull_request' }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Use desired version of Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            # It's not necessary to run the full build, since Jest can interpret
            # source files with `babel-jest`. Some packages have their own custom
            # build tasks, however. These must be run.
            - name: Run build scripts
              run: ./node_modules/.bin/lerna run build

            - name: Running the tests
              run: npm run test-unit -- --ci --maxWorkers=2 --cacheDirectory="$HOME/.jest-cache"

    unit-php:
        name: PHP ${{ matrix.php }}${{ matrix.multisite && ' multisite' || '' }}
        runs-on: 'ubuntu-24.04'
        env:
            # The `php`, `cli` and `phpunit` images in the `wordpress-develop` local
            # environment are all selected through this variable.
            LOCAL_PHP: ${{ matrix.php }}-fpm
        permissions:
            contents: read
        timeout-minutes: 20
        if: ${{ github.repository == 'WordPress/gutenberg' || github.event_name == 'pull_request' }}
        strategy:
            # Don't let one PHP version's failure cancel the others -- each leg is
            # independently useful signal.
            fail-fast: false
            matrix:
                # The oldest and newest PHP versions supported by the WordPress version
                # this branch was shipped with, plus the first PHP 7 release.
                php: ['5.6', '7.0', '7.4']
                multisite: [false, true]

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Use desired version of Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            # The plugin reads the built files when it loads, so it must be built
            # before the tests can run.
            - name: Build
              run: npm run build

            - name: Install WordPress
              uses: ./.github/setup-wordpress

            - name: Composer debug information
              working-directory: wordpress
              run: docker compose run --rm php composer --version

            # The WordPress test suite requires the PHPUnit Polyfills, and expects to find them in the
            # `vendor` directory of `wordpress-develop`. This mirrors how `wordpress-develop` installs its
            # Composer dependencies when testing this branch.
            - name: Install the PHPUnit Polyfills (PHP 5.6 and 7.0)
              if: ${{ matrix.php == '5.6' || matrix.php == '7.0' }}
              working-directory: wordpress
              run: docker compose run --rm php composer require --dev phpunit/phpunit:"^5.7" --update-with-dependencies

            - name: Install the PHPUnit Polyfills
              if: ${{ matrix.php != '5.6' && matrix.php != '7.0' }}
              working-directory: wordpress
              run: docker compose run --rm php composer install

            # `npm run test-php` is not used because it also runs `npm run lint-php`. PHP coding
            # standards are checked in the separate `phpcs` job instead.
            - name: Running the tests (single site)
              if: ${{ ! matrix.multisite }}
              run: npm run test-unit-php

            - name: Running the tests (multisite)
              if: ${{ matrix.multisite }}
              run: npm run test-unit-php-multisite

    phpcs:
        name: PHP coding standards
        runs-on: 'ubuntu-24.04'
        permissions:
            contents: read
        timeout-minutes: 20
        if: ${{ github.repository == 'WordPress/gutenberg' || github.event_name == 'pull_request' }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            # The `composer/installers` and `dealerdirect/phpcodesniffer-composer-installer` versions
            # locked in `composer.lock` only support Composer 1 and PHP 7 or older. On PHP 7.4, the
            # locked WPCS 2.1.1 raises notices that abort the scan, so PHP 7.3 is used.
            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
              with:
                  php-version: '7.3'
                  coverage: none
                  tools: composer:v1, cs2pr

            # This date is used to ensure that the PHPCS cache is cleared at least once every week.
            # http://man7.org/linux/man-pages/man1/date.1.html
            - name: "Get last Monday's date"
              id: get-date
              run: echo "date=$(/bin/date -u --date='last Mon' "+%F")" >> "$GITHUB_OUTPUT"

            - name: Cache PHPCS scan cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .cache/phpcs.json
                  key: ${{ runner.os }}-date-${{ steps.get-date.outputs.date }}-phpcs-cache-${{ hashFiles('**/composer.json', 'phpcs.xml.dist') }}

            # Passing a custom cache suffix ensures that the cache is flushed at least once per week.
            - name: Install Composer dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
              with:
                  custom-cache-suffix: ${{ steps.get-date.outputs.date }}

            - name: Make Composer packages available globally
              run: echo "${PWD}/vendor/bin" >> "$GITHUB_PATH"

            - name: Run PHPCS on all Gutenberg files
              id: phpcs-gutenberg
              run: phpcs --report-full --report-checkstyle=./.cache/phpcs-report.xml

            - name: Show PHPCS results in PR
              if: ${{ always() && steps.phpcs-gutenberg.outcome == 'failure' }}
              run: cs2pr ./.cache/phpcs-report.xml
