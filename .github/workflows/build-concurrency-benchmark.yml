name: Build concurrency benchmark

# Temporary: compares wp-build phase times before and after this branch's change.
on:
    push:
        branches:
            - claude/gb-ci-build-speed-7c4fb7

permissions: {}

jobs:
    benchmark:
        name: ${{ matrix.cores }} cores, round ${{ matrix.round }}
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                cores: [2, 4]
                round: [1, 2, 3]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Fetch the commit this branch starts from
              run: git fetch --depth=1 --no-tags origin e4d92945c5328652fa61f8eb5b47fdaba0c8dc90

            - name: Setup Node.js and install dependencies
              uses: ./.github/setup-node

            - name: Warm-up build
              run: taskset -c 0-$(( ${{ matrix.cores }} - 1 )) npm run build > /dev/null

            - name: Measure before and after
              env:
                  CORES: ${{ matrix.cores }}
                  ROUND: ${{ matrix.round }}
                  BASE: e4d92945c5328652fa61f8eb5b47fdaba0c8dc90
              run: |
                  cpus="0-$(( CORES - 1 ))"
                  echo "cores,version,round,run,transpile,bundle,routes,widgets,wp_build,total,max_rss_mb" > results.csv
                  run=0
                  for version in before after before after; do
                    run=$(( run + 1 ))
                    if [[ "$version" == before ]]; then
                      git checkout "$BASE" -- packages/wp-build/lib
                    else
                      git checkout HEAD -- packages/wp-build/lib
                    fi
                    /usr/bin/time -f '%M' -o rss.txt taskset -c "$cpus" npm run build 2>&1 |
                      while IFS= read -r line; do echo "$( date +%s.%N ) $line"; done > "build-$run-$version.log"
                    awk -v cores="$CORES" -v version="$version" -v round="$ROUND" -v run="$run" -v rss="$( tail -1 rss.txt )" '
                      NR == 1 { start = $1 }
                      /Phase 1:/ { p1 = $1 }
                      /Phase 2:/ { p2 = $1 }
                      /Phase 3:/ { p3 = $1 }
                      /Phase 4:/ { p4 = $1 }
                      /All packages built successfully/ { p5 = $1 }
                      /Build completed successfully/ { end = $1 }
                      END {
                        if ( ! end ) { exit 1 }
                        printf "%s,%s,%s,%s,%.1f,%.1f,%.1f,%.1f,%.1f,%.1f,%d\n", cores, version, round, run, p2 - p1, p3 - p2, p4 - p3, p5 - p4, p5 - p1, end - start, rss / 1024
                      }' "build-$run-$version.log" >> results.csv
                  done
                  cat results.csv
                  { echo '```'; cat results.csv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload results
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: results-${{ matrix.cores }}-${{ matrix.round }}
                  path: |
                      results.csv
                      build-*.log
