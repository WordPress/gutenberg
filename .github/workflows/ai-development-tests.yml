# Unit-test and validate the AI development eval harness without making model calls.
# Keep its separate install scoped to changes that can affect the harness.
name: AI development tests

on:
    pull_request:
        paths:
            - 'test/ai-development/**'
            - 'tools/agents/**'
            - '.agents/skills/**'
            - '.nvmrc'
            - '.github/workflows/ai-development-tests.yml'
    workflow_dispatch:

permissions: {}

jobs:
    agent-development:
        name: AI development tests (${{ contains(matrix.os, 'macos-') && 'MacOS' || contains(matrix.os, 'windows-') && 'Windows' || 'Linux' }})
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
        timeout-minutes: 30
        strategy:
            matrix:
                os: [macos-15, ubuntu-24.04, windows-2025]

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Setup Node.js and install dependencies
              uses: ./.github/setup-node

            - name: Install AI development test dependencies
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
              run: npm ci --prefix test/ai-development

            - name: Test AI development utilities
              run: npm --prefix test/ai-development run test:utils

            - name: Validate AI development configs
              run: npm --prefix test/ai-development run validate
