name: Update Changelog and upload Gutenberg plugin to WordPress.org plugin repo

on:
    release:
        types: [published]

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    # Confirm that the run's context contains a valid Git reference.
    validate-github-ref:
        name: Validate github.ref
        runs-on: 'ubuntu-24.04'
        permissions: {}
        steps:
            - name: Check github.ref
              run: |
                  if [ -z "${{ github.ref }}" ]; then
                    echo "::error::github.ref is empty ('${{ github.ref }}')"
                    exit 1
                  fi
                  echo "github.ref is valid: ${{ github.ref }}"

    # Evaluates whether trunk should be updated.
    #
    # Only final releases should be published to wordpress.org, so release candidates are skipped.
    compute-should-update-trunk:
        name: Decide if trunk or tag
        runs-on: 'ubuntu-24.04'
        needs: validate-github-ref
        permissions: {}
        if: |
            !github.event.release.prerelease && !contains(github.ref, 'rc')
        outputs:
            should_update_trunk: ${{ steps.compute_should_update_trunk.outputs.should_update_trunk }}

        steps:
            - name: Fetch latest version in the WP core repo
              id: compute_latest_version_in_core_repo
              run: |
                  latest_version_in_core_repo=$(curl -s 'https://api.wordpress.org/plugins/info/1.2/?action=plugin_information&request\[slug\]=gutenberg' | jq -r '.version')
                  echo "Latest Core Repo version: $latest_version_in_core_repo"
                  echo "version=$latest_version_in_core_repo" >> "$GITHUB_OUTPUT"

            - name: Decide if it is a trunk or tag update
              id: compute_should_update_trunk
              env:
                  GITHUB_REF: ${{ github.ref }}
                  LATEST_VERSION: ${{ steps.compute_latest_version_in_core_repo.outputs.version }}
              run: |
                  latestPublishedVersion=$(echo "$GITHUB_REF" | sed -E 's/refs\/tags\/(v?)([0-9.]+)/\2/')

                  # Determines if the first version string is greater than the second version string.
                  #
                  # Params:
                  #   $1 - The first version string to compare, which may have an optional leading "v".
                  #   $2 - The second version string to compare, which may have an optional leading "v".
                  #
                  # Return values:
                  #   0 - The first version string is greater than the second version string.
                  #   1 - The first version string is less than or equal to the second version string.
                  is_first_version_greater_than_second() {
                    v1=${1#v}
                    v2=${2#v}
                    dpkg --compare-versions "$v1" gt "$v2"
                    return $?
                  }

                  # Only update trunk *if* the published release's version in GitHub is GREATER
                  # than the version currently published in the WP plugins repo. If not, then it
                  # will upload it as a new tag.
                  shouldUpdateTrunk=false
                  if is_first_version_greater_than_second "$latestPublishedVersion" "$LATEST_VERSION"; then
                     shouldUpdateTrunk=true
                  fi

                  echo "Should update trunk: $shouldUpdateTrunk"
                  echo "should_update_trunk=$shouldUpdateTrunk" >> "$GITHUB_OUTPUT"

    # Determine the major version being released.
    #
    # This value is used for branch and tag names in both Git and SVN.
    compute-major-version:
        name: Compute major version
        runs-on: 'ubuntu-24.04'
        permissions: {}
        needs: validate-github-ref
        outputs:
            major_version: ${{ steps.compute_major_version.outputs.major_version }}

        steps:
            - name: Compute major version
              id: compute_major_version
              env:
                  VERSION: ${{ github.event.release.name }}
              run: |
                  IFS='.' read -r -a VERSION_ARRAY <<< "${VERSION#v}"
                  MAJOR_VERSION="${VERSION_ARRAY[0]}.${VERSION_ARRAY[1]}"
                  echo "Major version: ${MAJOR_VERSION}"
                  echo "major_version=${MAJOR_VERSION}" >> "$GITHUB_OUTPUT"

    # Update the changelog
    update-changelog:
        name: Update Changelog on ${{ matrix.branch }} branch
        runs-on: 'ubuntu-24.04'
        needs: compute-major-version
        if: |
            github.event.release.assets[0]
        permissions:
            contents: write
        env:
            TAG: ${{ github.event.release.tag_name }}
        strategy:
            matrix:
                include:
                    - branch: trunk
                      label: trunk
                    - branch: release/${{ needs.compute-major-version.outputs.major_version }}
                      label: release

        steps:
            - name: Checkout code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: ${{ matrix.branch }}
                  token: ${{ secrets.GUTENBERG_TOKEN }}
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: true

            - name: Update the Changelog to include the release notes
              env:
                  RELEASE_BODY: ${{ github.event.release.body }}
              run: |
                  # First, determine where to insert the new Changelog entry.
                  SERIES="${RELEASE_BRANCH#release/}"
                  SERIES_REGEX="=\s${SERIES}\.[0-9]+\s="
                  CUT_MARKS=$( grep -nP -m 1 "${SERIES_REGEX}" changelog.txt | cut -d: -f1 )
                  if [[ -z "${CUT_MARKS}" ]]; then
                    CHANGELOG_REGEX="=\s[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?\s="
                    RC_REGEX="=\s${TAG#v}(-rc\.[0-9]+)?\s="
                    CUT_MARKS=$( awk "/${RC_REGEX}/ {print NR; next}; /${CHANGELOG_REGEX}/ {print NR; exit}" changelog.txt )
                  fi
                  BEFORE=$( echo "$CUT_MARKS" | head -n 1 )
                  AFTER=$( echo "$CUT_MARKS" | tail -n 1 )
                  # Okay, we have all we need to build the new Changelog.
                  head -n $(( "${BEFORE}" - 1 )) changelog.txt > new_changelog.txt
                  printf '= %s =\n\n' "${TAG#v}" >> new_changelog.txt
                  # Need to use a heredoc in order to preserve special characters.
                  echo "$RELEASE_BODY" > release_notes.txt
                  # Normalize empty lines: Trim them from beginning and end of file...
                  awk 'NF {p=1} p' <<< "$(< release_notes.txt)" >> new_changelog.txt
                  # ...then add two empty lines at the end.
                  printf '\n\n' >> new_changelog.txt
                  tail -n +"${AFTER}" changelog.txt >> new_changelog.txt
                  mv new_changelog.txt changelog.txt

            - name: Configure git user name and email
              run: |
                  git config user.name "Gutenberg Repository Automation"
                  git config user.email gutenberg@wordpress.org

            - name: Commit the Changelog update
              env:
                  TARGET_BRANCH: ${{ matrix.branch }}
              run: |
                  git add changelog.txt
                  # Remove files that are not meant to be committed
                  # ie. release_notes.txt created on the previous step.
                  git clean -fd
                  # Only attempt to commit changelog if it has been modified.
                  if ! git diff-index --quiet HEAD --; then
                    git commit -m "Update Changelog for ${TAG#v}"
                    git push --set-upstream origin "$TARGET_BRANCH"
                  fi

            - name: Upload Changelog artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: changelog ${{ matrix.label }}
                  path: ./changelog.txt

    # Determine which targets receive the release.
    #
    # Version branches are always updated, but trunk is only updated when the release is
    # newer than the version currently published.
    #
    # Building the matrix here allows trunk to be skipped when an old version is being published without
    # excessive conditional checks.
    compute-commit-targets:
        name: Compute commit targets
        runs-on: 'ubuntu-24.04'
        permissions: {}
        needs: compute-should-update-trunk
        outputs:
            targets: ${{ steps.compute_commit_targets.outputs.targets }}

        steps:
            - name: Compute commit targets
              id: compute_commit_targets
              env:
                  SHOULD_UPDATE_TRUNK: ${{ needs.compute-should-update-trunk.outputs.should_update_trunk }}
              run: |
                  if [ "$SHOULD_UPDATE_TRUNK" = "true" ]; then
                    echo 'targets=["branch","trunk"]' >> "$GITHUB_OUTPUT"
                  else
                    echo 'targets=["branch"]' >> "$GITHUB_OUTPUT"
                  fi

    # Commit changes to the wordpress.org plugin directory.
    #
    # A matrix is used for this job, but `max-parallel` is set to `1` so only one write attempt is made at a time.
    commit-changes:
        name: Publish to ${{ matrix.target }}
        runs-on: 'ubuntu-24.04'
        environment: wp.org plugin
        needs: [compute-commit-targets, compute-major-version, update-changelog]
        if: |
            github.event.release.assets[0]
        permissions: {}
        env:
            PLUGIN_REPO_URL: ${{ vars.WP_ORG_PLUGIN_REPO_URL }}
            SVN_USERNAME: ${{ secrets.svn_username }}
            SVN_PASSWORD: ${{ secrets.svn_password }}
            VERSION: ${{ github.event.release.name }}
            SVN_PATH: ${{ matrix.target == 'trunk' && 'trunk' || format( 'branches/{0}', needs.compute-major-version.outputs.major_version ) }}
        strategy:
            fail-fast: false
            max-parallel: 1
            matrix:
                target: ${{ fromJSON(needs.compute-commit-targets.outputs.targets) }}

        steps:
            - name: Install Subversion
              run: sudo apt-get update -y && sudo apt-get install -y subversion

            # Branches will not exist for the first release in a series (X.Y.0).
            #
            # By creating an empty branch first, the remaining logic in the job can be the same.
            - name: Ensure SVN branch exists
              if: matrix.target == 'branch'
              run: |
                  svn_error_file="$(mktemp)"
                  if svn list "$PLUGIN_REPO_URL/$SVN_PATH" \
                    --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
                    --non-interactive --no-auth-cache >/dev/null 2>"$svn_error_file"; then
                    echo "SVN branch $SVN_PATH already exists."
                  else
                    if grep -Eq 'E160013|W160013|E200009|non-existent' "$svn_error_file"; then
                      echo "Creating SVN branch $SVN_PATH."
                      svn mkdir --parents "$PLUGIN_REPO_URL/$SVN_PATH" \
                        -m "Creating branch $SVN_PATH" \
                        --no-auth-cache --non-interactive \
                        --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
                        --config-option=servers:global:http-timeout=600
                    else
                      cat "$svn_error_file" >&2
                      rm -f "$svn_error_file"
                      exit 1
                    fi
                  fi
                  rm -f "$svn_error_file"

            - name: Check out target from WP.org plugin repo
              run: |
                  svn checkout "$PLUGIN_REPO_URL/$SVN_PATH" svn \
                    --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
                    --non-interactive --no-auth-cache \
                    --config-option=servers:global:http-timeout=600

            - name: Delete everything
              working-directory: ./svn
              run: find . -maxdepth 1 -not -name ".svn" -not -name "." -not -name ".." -exec rm -rf {} +

            - name: Download and unzip Gutenberg plugin asset
              env:
                  PLUGIN_URL: ${{ github.event.release.assets[0].browser_download_url }}
              run: |
                  curl -L -o gutenberg.zip "$PLUGIN_URL"
                  unzip gutenberg.zip -d svn
                  rm gutenberg.zip

            - name: Replace the stable tag placeholder with the new version
              env:
                  STABLE_TAG_PLACEHOLDER: 'Stable tag: V\.V\.V'
              run: |
                  sed -i "s/$STABLE_TAG_PLACEHOLDER/Stable tag: $VERSION/g" ./svn/readme.txt

            - name: Download Changelog Artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: changelog trunk
                  path: svn

            - name: Add new files
              working-directory: ./svn
              run: svn st | grep '^?' | awk '{print $2}' | xargs -r svn add

            - name: Remove deleted files
              working-directory: ./svn
              run: svn st | grep '^!' | awk '{print $2}' | xargs -r svn rm

            - name: Check for changes
              id: svn_diff
              working-directory: ./svn
              run: |
                  if [ -n "$(svn status -q)" ]; then
                    echo "has_changes=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_changes=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Commit changes
              if: steps.svn_diff.outputs.has_changes == 'true'
              working-directory: ./svn
              run: |
                  svn commit -m "Releasing version $VERSION to $SVN_PATH" \
                   --no-auth-cache --non-interactive --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
                   --config-option=servers:global:http-timeout=600

            - name: Verify stable version
              run: |
                  committed_version="$(
                    svn cat "$PLUGIN_REPO_URL/$SVN_PATH/readme.txt" \
                    --no-auth-cache --non-interactive \
                    --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
                    --config-option=servers:global:http-timeout=600 \
                    | grep -i '^Stable tag:' | head -n 1 | sed 's/^Stable tag:[[:space:]]*//' | tr -d '[:space:]'
                  )"

                  if [ "$committed_version" = "$VERSION" ]; then
                    echo "Verified: Stable tag in $SVN_PATH is $committed_version."
                  else
                    echo "::error::Version mismatch: expected Stable tag in $SVN_PATH of '$VERSION'. Found '$committed_version'."
                    exit 1
                  fi

            - name: Verify plugin version
              run: |
                  plugin_version="$(
                    svn cat "$PLUGIN_REPO_URL/$SVN_PATH/gutenberg.php" \
                    --no-auth-cache --non-interactive \
                    --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
                    --config-option=servers:global:http-timeout=600 \
                    | grep -iE '^[[:space:]*]*Version:' | head -n 1 \
                    | sed -E 's/^[[:space:]*]*Version:[[:space:]]*//I' | tr -d '[:space:]'
                  )"

                  if [ "$plugin_version" = "$VERSION" ]; then
                    echo "Verified: Plugin version in $SVN_PATH is $plugin_version."
                  else
                    echo "::error::Version mismatch: expected plugin version in $SVN_PATH of '$VERSION'. Found '$plugin_version'."
                    exit 1
                  fi

    # Create a tag in the wordpress.org plugin directory SVN repository.
    #
    # The tag is created from trunk when a new latest version is published. Otherwise, the tag is created from the
    # corresponding release branch.
    tag-release:
        name: Tag the release
        runs-on: 'ubuntu-24.04'
        permissions: {}
        environment: wp.org plugin
        needs:
            [compute-should-update-trunk, compute-major-version, commit-changes]
        if: |
            github.event.release.assets[0]
        env:
            PLUGIN_REPO_URL: ${{ vars.WP_ORG_PLUGIN_REPO_URL }}
            SVN_USERNAME: ${{ secrets.svn_username }}
            SVN_PASSWORD: ${{ secrets.svn_password }}
            VERSION: ${{ github.event.release.name }}
            SVN_PATH: ${{ needs.compute-should-update-trunk.outputs.should_update_trunk && 'trunk' || format( 'branches/{0}', needs.compute-major-version.outputs.major_version ) }}
        steps:
            - name: Install Subversion
              run: sudo apt-get update -y && sudo apt-get install -y subversion

            - name: Check if SVN tag already exists
              id: check_svn_tag
              run: |
                  svn_error_file="$(mktemp)"
                  if svn list "$PLUGIN_REPO_URL/tags/$VERSION" \
                    --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
                    --non-interactive --no-auth-cache >/dev/null 2>"$svn_error_file"; then
                    echo "::warning::SVN tag tags/$VERSION already exists. It will be removed and recreated from $SVN_PATH."
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                    svn_status=$?
                    # WP.org SVN may report a missing tag as W160013 followed by E200009.
                    if grep -Eq 'E160013|W160013|E200009|non-existent' "$svn_error_file"; then
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                    else
                      cat "$svn_error_file" >&2
                      rm -f "$svn_error_file"
                      exit "$svn_status"
                    fi
                  fi
                  rm -f "$svn_error_file"

            - name: Remove the existing tag
              if: steps.check_svn_tag.outputs.exists == 'true'
              run: |
                  svn rm "$PLUGIN_REPO_URL/tags/$VERSION" \
                    -m "Removing tag $VERSION to recreate it from $SVN_PATH" \
                    --no-auth-cache --non-interactive \
                    --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
                    --config-option=servers:global:http-timeout=600

            - name: Tag the new version
              run: |
                  # A cheap server-side copy from the branch, which the upload job guarantees
                  # exists and holds this release's content.
                  svn cp "$PLUGIN_REPO_URL/$SVN_PATH" "$PLUGIN_REPO_URL/tags/$VERSION" \
                    -m "Tagging version $VERSION" \
                    --no-auth-cache --non-interactive \
                    --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
                    --config-option=servers:global:http-timeout=600
