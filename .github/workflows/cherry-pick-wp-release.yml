name: Auto Cherry-Pick

on:
    # closed: cherry-pick when a labeled PR is merged.
    # labeled: cherry-pick when a label is added after the PR is merged.
    # Using pull_request_target instead of pull_request so that the workflow
    # has access to repository secrets for fork PRs.
    # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#pull_request_target
    pull_request_target:
        types: [closed, labeled]
        branches:
            - trunk

# Ensure that new jobs wait for the previous job to finish.
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    cherry-pick:
        runs-on: 'ubuntu-24.04'
        permissions:
            contents: write
            issues: write
            pull-requests: write
        if: github.event.pull_request.merged == true
        steps:
            - name: Determine if label should trigger cherry-pick
              id: label-check
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const pr = context.payload.pull_request;
                      const commit_sha = pr.merge_commit_sha;
                      const pr_number = pr.number;
                      console.log(`Commit SHA: ${commit_sha}`);
                      console.log(`PR: ${pr_number}`);
                      core.setOutput('commit_sha', commit_sha);
                      core.setOutput('pr_number', pr_number);

                      const labels = pr.labels.map(label => label.name);
                      console.log(`Labels: ${labels}`);
                      const regex = /^Backport to WP ([0-9]+\.[0-9]+) Beta\/RC$/;
                      let matched = false;
                      let version = '';
                      for (const label of labels) {
                        const match = label.match(regex);
                        if (match) {
                          version = match[1];
                          console.log(`Matched label: ${label}`);
                          console.log(`Extracted version: ${version}`);
                          matched = true;
                          break;
                        }
                      }
                      core.setOutput('cherry_pick', matched.toString());
                      core.setOutput('version', version);

            - name: Checkout repository
              if: steps.label-check.outputs.cherry_pick == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ secrets.GUTENBERG_TOKEN }}
                  fetch-depth: 0
                  persist-credentials: true

            - name: Set up Git
              if: steps.label-check.outputs.cherry_pick == 'true'
              run: |
                  git config --global user.name "Gutenberg Repository Automation"
                  git config --global user.email "gutenberg@wordpress.org"

            - name: Cherry-pick the commit
              id: cherry-pick
              if: steps.label-check.outputs.cherry_pick == 'true'
              env:
                  VERSION: ${{ steps.label-check.outputs.version }}
                  COMMIT_SHA: ${{ steps.label-check.outputs.commit_sha }}
              run: |
                  TARGET_BRANCH="wp/${VERSION}"
                  echo "Target branch: $TARGET_BRANCH"
                  echo "Commit SHA: $COMMIT_SHA"
                  git checkout "$TARGET_BRANCH"
                  git cherry-pick "$COMMIT_SHA" || echo "cherry-pick-failed" > result
                  if [ -f result ] && grep -q "cherry-pick-failed" result; then
                    echo "conflict=true" >> "$GITHUB_OUTPUT"
                    git cherry-pick --abort
                  else
                    CHERRY_PICK_SHA="$(git rev-parse HEAD)"
                    echo "conflict=false" >> "$GITHUB_OUTPUT"
                    echo "cherry_pick_sha=$CHERRY_PICK_SHA" >> "$GITHUB_OUTPUT"
                    git push origin "$TARGET_BRANCH"
                  fi
            - name: Remove cherry-pick label
              if: steps.label-check.outputs.cherry_pick == 'true' && steps.cherry-pick.outputs.conflict == 'false'
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  PR_NUMBER: ${{ steps.label-check.outputs.pr_number }}
                  VERSION: ${{ steps.label-check.outputs.version }}
              with:
                  script: |
                      const prNumber = Number(process.env.PR_NUMBER);
                      const version = process.env.VERSION;
                      console.log(`prNumber: ${prNumber}`);
                      console.log(`version: ${version}`);
                      const oldLabel = `Backport to WP ${version} Beta/RC`;
                      const newLabel = `Backported to WP Core`;
                      await github.rest.issues.removeLabel({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: prNumber,
                        name: oldLabel
                      });
                      await github.rest.issues.addLabels({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: prNumber,
                        labels: [newLabel]
                      });

            - name: Comment on the PR
              if: steps.label-check.outputs.cherry_pick == 'true' && steps.cherry-pick.outputs.conflict == 'false'
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  PR_NUMBER: ${{ steps.label-check.outputs.pr_number }}
                  VERSION: ${{ steps.label-check.outputs.version }}
                  CHERRY_PICK_SHA: ${{ steps.cherry-pick.outputs.cherry_pick_sha }}
              with:
                  script: |
                      const prNumber = Number(process.env.PR_NUMBER);
                      const cherryPickSha = process.env.CHERRY_PICK_SHA;
                      const targetBranch = `wp/${process.env.VERSION}`;
                      console.log(`prNumber: ${prNumber}`);
                      console.log(`cherryPickSha: ${cherryPickSha}`);
                      console.log(`targetBranch: ${targetBranch}`);
                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: prNumber,
                        body: `I just cherry-picked this PR to the ${targetBranch} branch to get it included in the next release: ${cherryPickSha}`
                      });

            - name: Comment on the PR about conflict
              if: steps.label-check.outputs.cherry_pick == 'true' && steps.cherry-pick.outputs.conflict == 'true'
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  PR_NUMBER: ${{ steps.label-check.outputs.pr_number }}
                  COMMIT_SHA: ${{ steps.label-check.outputs.commit_sha }}
                  VERSION: ${{ steps.label-check.outputs.version }}
              with:
                  script: |
                      const prNumber = Number(process.env.PR_NUMBER);
                      const commitSha = process.env.COMMIT_SHA;
                      const shortSha = commitSha.substring(0, 7);
                      const targetBranch = `wp/${process.env.VERSION}`;
                      const targetBranchSlug = targetBranch.replace(/\//g, '-');
                      const newBranchName = `cherry-pick/${shortSha}-to-${targetBranchSlug}-from-${prNumber}`;

                      console.log(`prNumber: ${prNumber}`);
                      console.log(`targetBranch: ${targetBranch}`);
                      console.log(`newBranchName: ${newBranchName}`);

                      const commentBody = [
                        `There was a conflict while trying to cherry-pick the commit to the \`${targetBranch}\` branch. Please resolve the conflict manually and create a PR to the \`${targetBranch}\` branch.`,
                        '',
                        `PRs to \`${targetBranch}\` are similar to PRs to \`trunk\`, but you should base your PR on the \`${targetBranch}\` branch instead of \`trunk\`.`,
                        '',
                        '```bash',
                        `# Checkout the ${targetBranch} branch instead of trunk.`,
                        `git checkout ${targetBranch}`,
                        '',
                        `# Create a new branch for your PR.`,
                        `git checkout -b ${newBranchName}`,
                        '',
                        `# Cherry-pick the commit.`,
                        `git cherry-pick ${commitSha}`,
                        '',
                        `# Check which files have conflicts (if any).`,
                        'git status',
                        '',
                        `# (If conflicts occur) Resolve the conflict, stage the files, and continue:`,
                        '# git add .',
                        '# git cherry-pick --continue',
                        '',
                        `# Push the branch to the repository (or your fork).`,
                        `git push origin ${newBranchName}`,
                        '```',
                        '',
                        '### Create the Pull Request',
                        `- **Using GitHub CLI**: \`gh pr create --base ${targetBranch} --web\``,
                        `- **Manually via web UI**: Make sure to [set the base branch to ${targetBranch}](https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/changing-the-base-branch-of-a-pull-request).`
                      ].join('\n');

                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: prNumber,
                        body: commentBody
                      });
