name: Vitest consumers

on:
    pull_request:
        paths:
            - 'packages/scripts/**'
            - 'packages/eslint-plugin/**'
            - 'tools/validation/test-vitest-consumers.mjs'
            - 'tools/validation/fixtures/vitest-consumer/**'
            - 'package-lock.json'
            - '.github/workflows/vitest-consumers.yml'
    workflow_dispatch:

permissions: {}

jobs:
    consumer:
        name: Node.js ${{ matrix.node }} / Vite ${{ matrix.vite }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                node: ['22.22.2', '24.15.0', '26.0.0']
                vite: ['6.4.0', '7.0.0', '8.0.0', '8.2.2']
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node }}
                  package-manager-cache: false
            - name: Test isolated public tooling
              env:
                  VITE_VERSION: ${{ matrix.vite }}
              run: node tools/validation/test-vitest-consumers.mjs --vite="$VITE_VERSION"
