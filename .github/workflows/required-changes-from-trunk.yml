name: Required changes from trunk

on:
    pull_request_target:
        types: [opened, synchronize, reopened, ready_for_review, edited, closed]
        branches: [trunk]
    push:
        branches: [trunk]
    workflow_dispatch:
        inputs:
            mode:
                description: 'auto moves the baseline only if a labeled merge earned it, then refreshes; move-baseline forces a move and then refreshes; refresh-pr-statuses only refreshes open PR statuses'
                type: choice
                default: auto
                options: [auto, move-baseline, refresh-pr-statuses]

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

env:
    # One source of truth for both jobs. No markers: the baseline moves only
    # through a labeled merge or a dispatch, never because a path changed.
    PR_BASELINES: '[{"name":"required-trunk-changes","label":"Require PR update"}]'
    STATUS_CONTEXT: Required changes from trunk
    DESCRIPTION_PASS: Includes required {base} changes.
    DESCRIPTION_FAIL: Merge or rebase {base} to include required changes.

jobs:
    check-pr:
        name: Report required trunk changes status
        if: >
            github.repository == 'WordPress/gutenberg' &&
            github.event_name == 'pull_request_target' && github.event.action != 'closed'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            statuses: write
        concurrency:
            group: required-trunk-changes-status-${{ github.event.pull_request.number }}
            cancel-in-progress: false
        steps:
            # The head SHA comes from the event. PR code is never checked out,
            # built, or executed.
            - name: Report the status for this pull request
              uses: mawesomedev/pr-baseline-action@8c21a09691ccfdf5ea118cb60cee8ec8b99231a1 # v0.1.1
              with:
                  base: trunk
                  baselines: ${{ env.PR_BASELINES }}
                  status-context: ${{ env.STATUS_CONTEXT }}
                  description-pass: ${{ env.DESCRIPTION_PASS }}
                  description-fail: ${{ env.DESCRIPTION_FAIL }}

    refresh-pr-statuses:
        name: Move the required trunk baseline and refresh statuses
        # The baseline moves only through explicit intent: a merged pull request
        # carrying the label, or a dispatch with mode move-baseline. Every trunk
        # push recovers a move whose own run was lost, and continues a refresh
        # that stopped on its write budget.
        if: >
            github.repository == 'WordPress/gutenberg' && (
                (github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged) ||
                (github.event_name == 'push' && github.ref_name == 'trunk') ||
                github.event_name == 'workflow_dispatch'
            )
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: write
            statuses: write
            pull-requests: read
        concurrency:
            group: required-trunk-changes-refresh
            cancel-in-progress: false
            # The default queue keeps a single pending run, so a trunk push could
            # replace (cancel) a pending forced dispatch; queue: max keeps them all.
            queue: max
        steps:
            # Treeless but complete history: ancestry needs commits, not trees,
            # and reading it from the clone costs no API quota.
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: trunk
                  fetch-depth: 0
                  filter: tree:0
                  persist-credentials: false

            - name: Move the baseline and refresh open pull requests
              id: pr-baseline
              uses: mawesomedev/pr-baseline-action@8c21a09691ccfdf5ea118cb60cee8ec8b99231a1 # v0.1.1
              with:
                  base: trunk
                  baselines: ${{ env.PR_BASELINES }}
                  status-context: ${{ env.STATUS_CONTEXT }}
                  description-pass: ${{ env.DESCRIPTION_PASS }}
                  description-fail: ${{ env.DESCRIPTION_FAIL }}
                  mode: ${{ inputs.mode || 'auto' }}
                  force: ${{ inputs.mode == 'move-baseline' }}

            - name: Upload the per-pull-request results
              if: ${{ always() && steps.pr-baseline.outputs.results-file != '' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: required-trunk-changes-refresh
                  path: ${{ steps.pr-baseline.outputs.results-file }}
