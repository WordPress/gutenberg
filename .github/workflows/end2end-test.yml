name: End-to-End Tests

on:
    pull_request:
    push:
        branches:
            - trunk
            - 'release/[0-9]+.[0-9]'
            - 'wp/[0-9]+.[0-9]'
            - wp/latest
            - wp/next

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

# Runs WordPress on PHP 8.5, the highest version WordPress 7.0 supports, instead of
# whatever version the floating `wordpress` image uses.
env:
    WP_ENV_PHP_VERSION: '8.5'

jobs:
    build:
        name: Build
        runs-on: 'ubuntu-24.04'
        timeout-minutes: 30
        permissions:
            contents: read
        if: ${{ github.repository == 'WordPress/gutenberg' || github.event_name == 'pull_request' }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Setup Node.js and install dependencies
              uses: ./.github/setup-node

            # The build starts many processes at once. On runners with fewer
            # resources, such as those used by private forks, the kernel can
            # refuse to start more of them (`spawn ENOMEM`). Extra swap raises
            # the amount of memory that can be committed.
            - name: Add swap space
              run: |
                  sudo fallocate -l 4G /mnt/swapfile-build
                  sudo chmod 600 /mnt/swapfile-build
                  sudo mkswap /mnt/swapfile-build
                  sudo swapon /mnt/swapfile-build

            - name: Npm build
              run: npm run build -- --skip-types

            # Wider than the `build*` directories, because the build also emits
            # generated files next to sources: the block parsers, the icon
            # library, and the worker entry points.
            - name: Upload build output
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: build-output
                  path: |
                      build
                      packages/*/build
                      packages/*/build-module
                      packages/*/build-style
                      packages/*/build-types
                      packages/*/build-wp
                      packages/*/src/library/*.tsx
                      packages/*/src/library/index.ts
                      packages/*/src/worker-code.ts
                      packages/block-serialization-spec-parser/parser.js
                      packages/block-serialization-spec-parser/parser.php
                  retention-days: 3
                  if-no-files-found: error
                  # Allow re-running the workflow over a previous attempt.
                  overwrite: true

    e2e-playwright:
        name: Playwright - ${{ matrix.part }}
        runs-on: 'ubuntu-24.04'
        needs: build
        timeout-minutes: 60
        # A skipped check counts as passing for required status checks, so a
        # broken build must not skip these jobs — they have to start and go red
        # (see the guard step below). `!cancelled()` is what drops the implicit
        # `success()`; `!= 'skipped'` keeps the fork/repository filter that now
        # lives on the build job.
        if: ${{ !cancelled() && needs.build.result != 'skipped' }}
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                part: [1, 2, 3, 4, 5, 6, 7, 8]
                totalParts: [8]

        steps:
            # Bail out before checkout and `npm ci` rather than after.
            - name: Fail if the build job failed
              if: ${{ needs.build.result != 'success' }}
              run: exit 1

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Setup Node.js and install dependencies
              uses: ./.github/setup-node

            - name: Download build output
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: build-output

            - name: Install Playwright dependencies
              run: |
                  npx playwright install chromium firefox webkit --with-deps

            - name: Install WordPress and start the server
              run: |
                  npm run wp-env-test start

            - name: Run the tests
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
                  SHARD_PART: ${{ matrix.part }}
                  SHARD_TOTAL: ${{ matrix.totalParts }}
              run: |
                  xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npm run test:e2e -- --shard="${SHARD_PART}/${SHARD_TOTAL}"

            - name: Archive debug artifacts (screenshots, traces)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: ${{ !cancelled() }}
              with:
                  name: failures-artifacts--${{ matrix.part }}
                  path: artifacts/test-results
                  if-no-files-found: ignore
                  retention-days: 14

    merge-artifacts:
        name: Merge Artifacts
        if: ${{ !cancelled() }}
        needs: [e2e-playwright]
        runs-on: 'ubuntu-24.04'
        timeout-minutes: 5
        permissions: {}
        steps:
            - name: Merge failures artifacts
              uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              # Don't fail the job if there aren't any artifacts to merge.
              continue-on-error: true
              with:
                  name: failures-artifacts
                  # Retain the merged artifacts in case of a rerun.
                  pattern: failures-artifacts*
                  delete-merged: true
                  retention-days: 14
