name: End-to-End Test Video

on:
    pull_request:

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

env:
    E2E_SPEC_FILE: test/e2e/specs/editor/various/new-post.spec.js
    E2E_VIDEO_COMMENT_IDENTIFIER: '<!-- gutenberg-e2e-video-comment -->'
    E2E_VIDEO_ARTIFACT_PREFIX: e2e-video-${{ github.run_id }}-${{ github.run_attempt }}
    E2E_VIDEO_UPLOAD_LIMIT: 10
    WP_ARTIFACTS_PATH: ${{ github.workspace }}/artifacts
    WORKFLOW_JOB_NAME: Record video

jobs:
    e2e-video:
        name: Record video
        runs-on: 'ubuntu-24.04'
        timeout-minutes: 30
        permissions:
            actions: read
            contents: read
            issues: write
            pull-requests: write

        steps:
            - name: Update PR comment - queued
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
              continue-on-error: true
              env:
                  COMMENT_STATUS: Queued
                  COMMENT_DETAILS: The workflow job has started and the selected spec is waiting for setup.
              with:
                  script: |
                      const pullRequest = context.payload.pull_request;
                      if ( ! pullRequest ) {
                        core.info( 'No pull request found in the event payload.' );
                        return;
                      }

                      const marker = process.env.E2E_VIDEO_COMMENT_IDENTIFIER;
                      const runMarker = `<!-- gutenberg-e2e-video-run:${ context.runId }-${ process.env.GITHUB_RUN_ATTEMPT } -->`;
                      const runUrl = `${ context.serverUrl }/${ context.repo.owner }/${ context.repo.repo }/actions/runs/${ context.runId }`;
                      let jobUrl = runUrl;

                      try {
                        const { data } = await github.rest.actions.listJobsForWorkflowRunAttempt( {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          run_id: context.runId,
                          attempt_number: Number( process.env.GITHUB_RUN_ATTEMPT ),
                        } );
                        const job = data.jobs.find(
                          ( candidate ) => candidate.name === process.env.WORKFLOW_JOB_NAME
                        );
                        jobUrl = job?.html_url ?? jobUrl;
                      } catch ( error ) {
                        core.info( `Unable to find workflow job URL: ${ error.message }` );
                      }

                      const body = [
                        marker,
                        runMarker,
                        '### E2E Test Video',
                        '',
                        '| Item | Details |',
                        '| --- | --- |',
                        `| Status | ${ process.env.COMMENT_STATUS } |`,
                        `| Details | ${ process.env.COMMENT_DETAILS } |`,
                        `| Spec | \`${ process.env.E2E_SPEC_FILE }\` |`,
                        `| Workflow job | [View job](${ jobUrl }) |`,
                        '| Video artifacts | Not available yet |',
                        '',
                        `Last updated: ${ new Date().toISOString() }`,
                      ].join( '\n' );

                      const comments = await github.paginate( github.rest.issues.listComments, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: pullRequest.number,
                      } );
                      const comment = comments.find( ( candidate ) =>
                        candidate.body?.includes( marker )
                      );

                      if ( comment ) {
                        await github.rest.issues.updateComment( {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: comment.id,
                          body,
                        } );
                        return;
                      }

                      await github.rest.issues.createComment( {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: pullRequest.number,
                        body,
                      } );

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Setup Node.js and install dependencies
              uses: ./.github/setup-node

            - name: Npm build
              run: npm run build -- --skip-types

            - name: Install Playwright dependencies
              run: |
                  npx playwright install chromium firefox webkit --with-deps

            - name: Install FFmpeg
              run: |
                  if ! command -v ffmpeg > /dev/null 2>&1; then
                      sudo apt-get update
                      sudo apt-get install -y ffmpeg
                  fi

                  ffmpeg -version

            - name: Install WordPress and start the server
              run: |
                  npm run wp-env-test start

            - name: Update PR comment - running
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
              continue-on-error: true
              env:
                  COMMENT_STATUS: Running
                  COMMENT_DETAILS: The selected spec is running with Playwright video capture enabled.
              with:
                  script: |
                      const pullRequest = context.payload.pull_request;
                      if ( ! pullRequest ) {
                        core.info( 'No pull request found in the event payload.' );
                        return;
                      }

                      const marker = process.env.E2E_VIDEO_COMMENT_IDENTIFIER;
                      const runMarkerPrefix = '<!-- gutenberg-e2e-video-run:';
                      const runMarker = `${ runMarkerPrefix }${ context.runId }-${ process.env.GITHUB_RUN_ATTEMPT } -->`;
                      const runUrl = `${ context.serverUrl }/${ context.repo.owner }/${ context.repo.repo }/actions/runs/${ context.runId }`;
                      let jobUrl = runUrl;

                      try {
                        const { data } = await github.rest.actions.listJobsForWorkflowRunAttempt( {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          run_id: context.runId,
                          attempt_number: Number( process.env.GITHUB_RUN_ATTEMPT ),
                        } );
                        const job = data.jobs.find(
                          ( candidate ) => candidate.name === process.env.WORKFLOW_JOB_NAME
                        );
                        jobUrl = job?.html_url ?? jobUrl;
                      } catch ( error ) {
                        core.info( `Unable to find workflow job URL: ${ error.message }` );
                      }

                      const body = [
                        marker,
                        runMarker,
                        '### E2E Test Video',
                        '',
                        '| Item | Details |',
                        '| --- | --- |',
                        `| Status | ${ process.env.COMMENT_STATUS } |`,
                        `| Details | ${ process.env.COMMENT_DETAILS } |`,
                        `| Spec | \`${ process.env.E2E_SPEC_FILE }\` |`,
                        `| Workflow job | [View job](${ jobUrl }) |`,
                        '| Video artifacts | Not available yet |',
                        '',
                        `Last updated: ${ new Date().toISOString() }`,
                      ].join( '\n' );

                      const comments = await github.paginate( github.rest.issues.listComments, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: pullRequest.number,
                      } );
                      const comment = comments.find( ( candidate ) =>
                        candidate.body?.includes( marker )
                      );

                      if ( comment ) {
                        if (
                          comment.body?.includes( runMarkerPrefix ) &&
                          ! comment.body?.includes( runMarker )
                        ) {
                          core.info( 'A newer workflow run owns the PR comment. Skipping update.' );
                          return;
                        }

                        await github.rest.issues.updateComment( {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: comment.id,
                          body,
                        } );
                        return;
                      }

                      await github.rest.issues.createComment( {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: pullRequest.number,
                        body,
                      } );

            - name: Run selected E2E spec
              id: run-tests
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
                  PLAYWRIGHT_VIDEO: on
              run: |
                  if [[ ! -f "$E2E_SPEC_FILE" ]]; then
                      echo "::error::E2E_SPEC_FILE does not exist: $E2E_SPEC_FILE"
                      exit 1
                  fi

                  SPEC_FILE="${E2E_SPEC_FILE#test/e2e/}"
                  xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npm run --workspace @wordpress/e2e-tests-playwright test:e2e -- "$SPEC_FILE"

            - name: Prepare test videos
              id: prepare-videos
              if: ${{ always() }}
              run: |
                  VIDEO_UPLOAD_DIR="$WP_ARTIFACTS_PATH/e2e-video-uploads"
                  rm -rf "$VIDEO_UPLOAD_DIR"
                  mkdir -p "$VIDEO_UPLOAD_DIR"

                  mapfile -d '' VIDEOS < <(find "$WP_ARTIFACTS_PATH/test-results" -type f -name '*.webm' -print0 | sort -z)
                  VIDEO_COUNT="${#VIDEOS[@]}"
                  echo "count=$VIDEO_COUNT" >> "$GITHUB_OUTPUT"

                  if (( VIDEO_COUNT == 0 )); then
                      echo "::error::No Playwright videos were created."
                      exit 1
                  fi

                  if (( VIDEO_COUNT > E2E_VIDEO_UPLOAD_LIMIT )); then
                      echo "::warning::Found $VIDEO_COUNT videos. Uploading the first $E2E_VIDEO_UPLOAD_LIMIT."
                  fi

                  for SLOT in $(seq 1 "$E2E_VIDEO_UPLOAD_LIMIT"); do
                      VIDEO_PATH="$VIDEO_UPLOAD_DIR/video-$SLOT.mp4"
                      VIDEO_INDEX=$((SLOT - 1))
                      if (( VIDEO_INDEX < VIDEO_COUNT )); then
                          ffmpeg -y -i "${VIDEOS[$VIDEO_INDEX]}" \
                              -an \
                              -c:v libx264 \
                              -preset veryfast \
                              -crf 23 \
                              -pix_fmt yuv420p \
                              -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2" \
                              -movflags +faststart \
                              "$VIDEO_PATH"
                          echo "video_${SLOT}_path=$VIDEO_PATH" >> "$GITHUB_OUTPUT"
                          continue
                      fi

                      echo "video_${SLOT}_path=" >> "$GITHUB_OUTPUT"
                  done

            - name: Upload test video 1
              id: upload-video-1
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              if: ${{ always() && steps.prepare-videos.outputs.video_1_path != '' }}
              with:
                  name: ${{ env.E2E_VIDEO_ARTIFACT_PREFIX }}-1
                  path: ${{ steps.prepare-videos.outputs.video_1_path }}
                  archive: false
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload test video 2
              id: upload-video-2
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              if: ${{ always() && steps.prepare-videos.outputs.video_2_path != '' }}
              with:
                  name: ${{ env.E2E_VIDEO_ARTIFACT_PREFIX }}-2
                  path: ${{ steps.prepare-videos.outputs.video_2_path }}
                  archive: false
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload test video 3
              id: upload-video-3
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              if: ${{ always() && steps.prepare-videos.outputs.video_3_path != '' }}
              with:
                  name: ${{ env.E2E_VIDEO_ARTIFACT_PREFIX }}-3
                  path: ${{ steps.prepare-videos.outputs.video_3_path }}
                  archive: false
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload test video 4
              id: upload-video-4
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              if: ${{ always() && steps.prepare-videos.outputs.video_4_path != '' }}
              with:
                  name: ${{ env.E2E_VIDEO_ARTIFACT_PREFIX }}-4
                  path: ${{ steps.prepare-videos.outputs.video_4_path }}
                  archive: false
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload test video 5
              id: upload-video-5
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              if: ${{ always() && steps.prepare-videos.outputs.video_5_path != '' }}
              with:
                  name: ${{ env.E2E_VIDEO_ARTIFACT_PREFIX }}-5
                  path: ${{ steps.prepare-videos.outputs.video_5_path }}
                  archive: false
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload test video 6
              id: upload-video-6
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              if: ${{ always() && steps.prepare-videos.outputs.video_6_path != '' }}
              with:
                  name: ${{ env.E2E_VIDEO_ARTIFACT_PREFIX }}-6
                  path: ${{ steps.prepare-videos.outputs.video_6_path }}
                  archive: false
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload test video 7
              id: upload-video-7
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              if: ${{ always() && steps.prepare-videos.outputs.video_7_path != '' }}
              with:
                  name: ${{ env.E2E_VIDEO_ARTIFACT_PREFIX }}-7
                  path: ${{ steps.prepare-videos.outputs.video_7_path }}
                  archive: false
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload test video 8
              id: upload-video-8
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              if: ${{ always() && steps.prepare-videos.outputs.video_8_path != '' }}
              with:
                  name: ${{ env.E2E_VIDEO_ARTIFACT_PREFIX }}-8
                  path: ${{ steps.prepare-videos.outputs.video_8_path }}
                  archive: false
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload test video 9
              id: upload-video-9
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              if: ${{ always() && steps.prepare-videos.outputs.video_9_path != '' }}
              with:
                  name: ${{ env.E2E_VIDEO_ARTIFACT_PREFIX }}-9
                  path: ${{ steps.prepare-videos.outputs.video_9_path }}
                  archive: false
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload test video 10
              id: upload-video-10
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              if: ${{ always() && steps.prepare-videos.outputs.video_10_path != '' }}
              with:
                  name: ${{ env.E2E_VIDEO_ARTIFACT_PREFIX }}-10
                  path: ${{ steps.prepare-videos.outputs.video_10_path }}
                  archive: false
                  if-no-files-found: error
                  retention-days: 14

            - name: Update PR comment - completed
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
              if: ${{ always() }}
              continue-on-error: true
              env:
                  TEST_OUTCOME: ${{ steps.run-tests.outcome }}
                  JOB_STATUS: ${{ job.status }}
                  VIDEO_COUNT: ${{ steps.prepare-videos.outputs.count }}
                  VIDEO_ARTIFACT_URL_1: ${{ steps.upload-video-1.outputs.artifact-url }}
                  VIDEO_ARTIFACT_URL_2: ${{ steps.upload-video-2.outputs.artifact-url }}
                  VIDEO_ARTIFACT_URL_3: ${{ steps.upload-video-3.outputs.artifact-url }}
                  VIDEO_ARTIFACT_URL_4: ${{ steps.upload-video-4.outputs.artifact-url }}
                  VIDEO_ARTIFACT_URL_5: ${{ steps.upload-video-5.outputs.artifact-url }}
                  VIDEO_ARTIFACT_URL_6: ${{ steps.upload-video-6.outputs.artifact-url }}
                  VIDEO_ARTIFACT_URL_7: ${{ steps.upload-video-7.outputs.artifact-url }}
                  VIDEO_ARTIFACT_URL_8: ${{ steps.upload-video-8.outputs.artifact-url }}
                  VIDEO_ARTIFACT_URL_9: ${{ steps.upload-video-9.outputs.artifact-url }}
                  VIDEO_ARTIFACT_URL_10: ${{ steps.upload-video-10.outputs.artifact-url }}
              with:
                  script: |
                      const pullRequest = context.payload.pull_request;
                      if ( ! pullRequest ) {
                        core.info( 'No pull request found in the event payload.' );
                        return;
                      }

                      const marker = process.env.E2E_VIDEO_COMMENT_IDENTIFIER;
                      const runMarkerPrefix = '<!-- gutenberg-e2e-video-run:';
                      const runMarker = `${ runMarkerPrefix }${ context.runId }-${ process.env.GITHUB_RUN_ATTEMPT } -->`;
                      const runUrl = `${ context.serverUrl }/${ context.repo.owner }/${ context.repo.repo }/actions/runs/${ context.runId }`;
                      let jobUrl = runUrl;

                      try {
                        const { data } = await github.rest.actions.listJobsForWorkflowRunAttempt( {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          run_id: context.runId,
                          attempt_number: Number( process.env.GITHUB_RUN_ATTEMPT ),
                        } );
                        const job = data.jobs.find(
                          ( candidate ) => candidate.name === process.env.WORKFLOW_JOB_NAME
                        );
                        jobUrl = job?.html_url ?? jobUrl;
                      } catch ( error ) {
                        core.info( `Unable to find workflow job URL: ${ error.message }` );
                      }

                      const testOutcome = process.env.TEST_OUTCOME || 'skipped';
                      const jobStatus = process.env.JOB_STATUS || testOutcome;
                      const videoCount = process.env.VIDEO_COUNT || '0';
                      const videoCountNumber = Number.parseInt( videoCount, 10 ) || 0;
                      const artifactUrls = Array.from( { length: 10 }, ( _, index ) =>
                        process.env[ `VIDEO_ARTIFACT_URL_${ index + 1 }` ]
                      ).filter( Boolean );
                      const artifact = artifactUrls.length
                        ? `${ artifactUrls.length } of ${ videoCountNumber || artifactUrls.length } H.264 MP4 video artifact(s) uploaded.`
                        : 'No video artifact was created. Check the workflow job logs.';
                      const artifactEmbeds = artifactUrls.flatMap( ( artifactUrl, index ) => [
                        `#### Video ${ index + 1 }`,
                        `[Open video artifact ${ index + 1 }](${ artifactUrl })`,
                        `![](${ artifactUrl })`,
                        '',
                      ] );

                      const body = [
                        marker,
                        runMarker,
                        '### E2E Test Video',
                        '',
                        '| Item | Details |',
                        '| --- | --- |',
                        `| Status | Completed (${ jobStatus }) |`,
                        `| Details | Test outcome: ${ testOutcome } |`,
                        `| Spec | \`${ process.env.E2E_SPEC_FILE }\` |`,
                        `| Workflow job | [View job](${ jobUrl }) |`,
                        `| Video artifacts | ${ artifact } |`,
                        `| Videos found | ${ videoCount } |`,
                        '',
                        ...artifactEmbeds,
                        `Last updated: ${ new Date().toISOString() }`,
                      ].join( '\n' );

                      const comments = await github.paginate( github.rest.issues.listComments, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: pullRequest.number,
                      } );
                      const comment = comments.find( ( candidate ) =>
                        candidate.body?.includes( marker )
                      );

                      if ( comment ) {
                        if (
                          comment.body?.includes( runMarkerPrefix ) &&
                          ! comment.body?.includes( runMarker )
                        ) {
                          core.info( 'A newer workflow run owns the PR comment. Skipping update.' );
                          return;
                        }

                        await github.rest.issues.updateComment( {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: comment.id,
                          body,
                        } );
                        return;
                      }

                      await github.rest.issues.createComment( {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: pullRequest.number,
                        body,
                      } );
