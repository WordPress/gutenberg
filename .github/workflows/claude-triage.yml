name: Claude Issue Triage

on:
    issues:
        types: [opened]
    issue_comment:
        types: [created]

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

# Cancel in-progress runs when a new workflow is triggered on the same issue
# This prevents duplicate runs when:
# - An issue is created and then someone comments before it finishes
# - Multiple comments are made quickly
#
# FIX: Include comment author in concurrency group for comment events.
# This prevents triage bot's own comments from cancelling legitimate runs.
# Bot comments get a separate group, so they won't cancel human-triggered runs.
concurrency:
    group: claude-triage-${{ github.event.issue.number }}-${{ github.event_name == 'issue_comment' && (github.event.comment.user.type == 'Bot' && 'bot' || github.event.comment.user.login) || 'default' }}
    cancel-in-progress: true

jobs:
    triage:
        runs-on: ubuntu-latest
        # Use protected environment - protection rules configured in GitHub Settings
        # This ensures only authorized users can trigger the workflow, even if
        # someone modifies the workflow file in a PR
        environment: triage-bot
        permissions:
            contents: read
            issues: write
            pull-requests: write
            id-token: write
        # Run on new issues OR when @claude is mentioned in a comment
        # FIX: Exclude bot comments to prevent self-triggering cancellation loop.
        # Even though concurrency group prevents cancellation, this adds defense in depth.
        if: |
            github.event_name == 'issues' ||
            (github.event_name == 'issue_comment' &&
             contains(github.event.comment.body, '@claude') &&
             github.event.comment.user.type != 'Bot' &&
             github.event.comment.user.login != 'github-actions[bot]')
        steps:
            - name: Checkout repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 1
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

            - name: Install Playwright browsers
              run: npx playwright install --with-deps firefox

            - name: Install WordPress Playground CLI
              run: npm install -g @wp-playground/cli

            - name: Create MCP config for CI
              run: |
                  cat > /tmp/mcp-config.json << 'EOF'
                  {
                    "mcpServers": {
                      "playwright": {
                        "command": "npx",
                        "args": ["-y", "@playwright/mcp", "--headless"]
                      },
                      "context7": {
                        "command": "npx",
                        "args": ["-y", "@context7/mcp"]
                      }
                    }
                  }
                  EOF

            - name: Run Claude Triage
              uses: anthropics/claude-code-action@v1
              env:
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_EVENT_NAME: ${{ github.event_name }}
                  GITHUB_ISSUE_NUMBER: ${{ github.event.issue.number }}
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  show_full_output: true
                  prompt: |
                      # GitHub Context
                      REPO: ${{ github.repository }}
                      ISSUE NUMBER: ${{ github.event.issue.number }}
                      EVENT: ${{ github.event_name }}
                      ACTOR: ${{ github.actor }}

                      # Instructions
                      Execute: /triage ${{ github.event.issue.number }}
                  claude_args: |
                      --model haiku
                      --mcp-config /tmp/mcp-config.json
                      --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Skill,mcp__playwright__browser_navigate,mcp__playwright__browser_snapshot,mcp__playwright__browser_click,mcp__playwright__browser_type,mcp__playwright__browser_press_key,mcp__playwright__browser_fill_form,mcp__playwright__browser_take_screenshot,mcp__playwright__browser_console_messages,mcp__playwright__browser_network_requests,mcp__playwright__browser_wait_for,mcp__playwright__browser_handle_dialog,mcp__playwright__browser_hover,mcp__playwright__browser_navigate_back,mcp__playwright__browser_close,mcp__context7"