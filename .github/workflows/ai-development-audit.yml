name: Audit AI development test dependencies

# The AI development tests have their own lockfile, and nothing in it ships.
# Audit it when it changes, and weekly for new advisories, rather than on every
# pull request: a new advisory would otherwise fail every unrelated pull request
# until someone lands a lockfile bump.
on:
    pull_request:
        paths:
            - 'test/ai-development/package.json'
            - 'test/ai-development/package-lock.json'
            - '.github/workflows/ai-development-audit.yml'
    push:
        branches:
            - trunk
        paths:
            - 'test/ai-development/package.json'
            - 'test/ai-development/package-lock.json'
            - '.github/workflows/ai-development-audit.yml'
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    audit:
        name: Audit
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        if: ${{ github.repository == 'WordPress/gutenberg' || github.event_name == 'pull_request' }}
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Use desired version of Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: '.nvmrc'
                  check-latest: true
                  package-manager-cache: false

            - name: Set up npm
              uses: ./.github/setup-npm
              with:
                  cache: 'false'

            # Audits the lockfile as written, including the optional dependencies
            # that `npm ci` installs, without installing anything.
            - name: Audit AI development test dependencies
              run: npm audit --package-lock-only --audit-level=high
              working-directory: test/ai-development
