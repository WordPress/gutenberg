# Advisory documentation checks.
#
# A non-blocking ("OPTIONAL") lane for documentation quality checks. Each check
# is a self-contained step that reports findings as warning annotations and does
# not fail the build. To add another documentation check, add a step that
# derives the changed documentation files (see "Check image hosting" below) and
# runs against them.
name: OPTIONAL - Documentation checks

on:
    pull_request:
        types: [opened, synchronize]
        branches:
            - trunk
        paths:
            - 'docs/**/*.md'
            - 'docs/**/*.mdx'
            - 'packages/**/README.md'

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    check:
        name: Documentation checks
        runs-on: 'ubuntu-24.04'
        permissions:
            contents: read
        steps:
            - name: 'Get PR commit count'
              env:
                  PR_COUNT: ${{ github.event.pull_request.commits }}
              run: echo "PR_COMMIT_COUNT=$(( PR_COUNT + 1 ))" >> "${GITHUB_ENV}"
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  fetch-depth: ${{ env.PR_COMMIT_COUNT }}
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false
            - name: Use desired version of Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: '24'
            - name: 'Fetch relevant history from origin'
              run: git fetch origin "$GITHUB_BASE_REF"
            - name: Check image hosting
              # This is an advisory check: the script always exits 0 and reports
              # GitHub-hosted images as warning annotations, so it never blocks a PR.
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  changed_files=$(git diff --name-only --diff-filter=d "$BASE_SHA" HEAD \
                      | grep -E '^(docs/.*\.mdx?|packages/.*/README\.md)$' \
                      | grep -v node_modules || true)

                  if [ -z "$changed_files" ]; then
                      echo "No documentation files changed; skipping image hosting check."
                      exit 0
                  fi

                  echo "$changed_files" | tr '\n' '\0' | xargs -0 node tools/validation/check-doc-image-hosting.mjs
