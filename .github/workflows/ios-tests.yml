name: iOS Tests

on:
    pull_request:
    push:
        branches:
            - trunk
            - 'release/**'
            - 'wp/**'

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    build:
        name: Build
        runs-on: ${{ vars.RUNNERS_NAME || 'ubuntu-24.04' }}
        permissions:
            contents: read
        if: ${{ github.repository == 'WordPress/gutenberg' || github.event_name == 'pull_request' }}
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Setup Node.js and install dependencies
              uses: ./.github/setup-node

            - name: Npm build
              run: npm run build -- --skip-types

            - name: Upload build output
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ios-build-output
                  path: build
                  retention-days: 3
                  if-no-files-found: error
                  overwrite: true

    safari:
        name: Safari on an iOS simulator
        # Safari and the iOS keyboard only run on Apple hardware.
        runs-on: macos-15
        needs: build
        timeout-minutes: 40
        if: ${{ !cancelled() && needs.build.result != 'skipped' }}
        permissions:
            contents: read

        steps:
            - name: Fail if the build job failed
              if: ${{ needs.build.result != 'success' }}
              run: exit 1

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            # The artifact holds the contents of `build`; without a path they
            # land in the repository root and the plugin serves core's bundles.
            - name: Download build output
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: ios-build-output
                  path: build

            - name: Set up PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
                  coverage: none

            - name: Install xcodegen
              run: brew install xcodegen

            # The image defaults to an older Xcode; the newest Xcode 26 has
            # the same UI testing stack as the iOS 26 simulator runtime.
            - name: Select the newest Xcode 26
              run: |
                  XCODE=$( find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1 )
                  [ -n "$XCODE" ] || { echo "No Xcode 26 on this runner image"; exit 1; }
                  sudo xcode-select -s "$XCODE"
                  xcodebuild -version

            - name: Run the tests
              run: ./test/ios/run.sh

            - name: Archive the test results
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ always() }}
              with:
                  name: ios-test-results
                  path: |
                      test/ios/build/results.xcresult
                      test/ios/build/server.log
                  if-no-files-found: ignore
