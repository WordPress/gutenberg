name: iOS Tests

on:
    pull_request:
    push:
        branches:
            - trunk
            - 'release/**'
            - 'wp/**'

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    build:
        name: Build
        runs-on: ${{ vars.RUNNERS_NAME || 'ubuntu-24.04' }}
        permissions:
            contents: read
        if: ${{ github.repository == 'WordPress/gutenberg' || github.event_name == 'pull_request' }}
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Setup Node.js and install dependencies
              uses: ./.github/setup-node

            - name: Npm build
              run: npm run build -- --skip-types

            - name: Upload build output
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ios-build-output
                  path: build
                  retention-days: 3
                  if-no-files-found: error
                  overwrite: true

    safari:
        name: ${{ matrix.suite }} on an ${{ matrix.device }} simulator
        # Safari and the iOS keyboard only run on Apple hardware.
        runs-on: macos-15
        needs: build
        timeout-minutes: 40
        if: ${{ !cancelled() && needs.build.result != 'skipped' }}
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    # The editor lays out by viewport width: a phone gets the
                    # mobile editor, a tablet the desktop one. Each suite runs
                    # on the device its behavior belongs to.
                    - device: iPhone
                      suite: AutoCapitalizationTests
                    - device: iPad
                      suite: CaretPlacementTests

        steps:
            - name: Fail if the build job failed
              if: ${{ needs.build.result != 'success' }}
              run: exit 1

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            # The artifact holds the contents of `build`; without a path they
            # land in the repository root and the plugin serves core's bundles.
            - name: Download build output
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ios-build-output
                  path: build

            - name: Install xcodegen
              run: brew install xcodegen

            # The image defaults to an older Xcode; the newest Xcode 26 has
            # the same UI testing stack as the iOS 26 simulator runtime.
            - name: Select the newest Xcode 26
              run: |
                  sudo xcode-select -s "$( find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1 )"
                  xcodebuild -version

            - name: Run the tests
              run: ./test/ios/run.sh -only-testing:SafariTests/${{ matrix.suite }}
              env:
                  SIMULATOR_DEVICE: ${{ matrix.device }}

            - name: Archive the test results
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: ${{ failure() }}
              with:
                  name: ios-test-results-${{ matrix.device }}-${{ matrix.suite }}
                  path: test/ios/build/results.xcresult
                  if-no-files-found: ignore
