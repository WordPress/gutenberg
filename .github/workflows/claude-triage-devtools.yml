name: Claude Issue Triage (Chrome DevTools)

on:
    # Manual trigger for testing
    workflow_dispatch:
        inputs:
            issue_number:
                description: 'Issue number to triage'
                required: true

    # Trigger when claude-devtools-test label is added
    issues:
        types: [labeled]

    # Trigger on @claude-devtools mention in comments
    issue_comment:
        types: [created]

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

# Cancel in-progress runs when a new workflow is triggered on the same issue
concurrency:
    group: claude-triage-devtools-${{ github.event.issue.number || github.event.inputs.issue_number }}
    cancel-in-progress: true

jobs:
    triage:
        runs-on: ubuntu-latest
        environment: triage-bot
        permissions:
            contents: read
            issues: write
            pull-requests: write
            id-token: write

        # Run when:
        # - Manual trigger (workflow_dispatch)
        # - Label 'claude-devtools-test' is added
        # - Comment contains '@claude-devtools'
        if: |
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude-devtools-test') ||
            (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude-devtools'))

        steps:
            - name: Checkout repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 1
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

            - name: Setup Chrome for DevTools MCP
              run: |
                  # GitHub runners have Chrome pre-installed - use it instead of snap chromium
                  # Snap chromium has sandbox restrictions that break in CI environments
                  if command -v google-chrome &> /dev/null; then
                    CHROME_BIN=$(which google-chrome)
                    echo "Using pre-installed Google Chrome: $CHROME_BIN"
                    google-chrome --version
                  elif command -v google-chrome-stable &> /dev/null; then
                    CHROME_BIN=$(which google-chrome-stable)
                    echo "Using pre-installed Google Chrome Stable: $CHROME_BIN"
                    google-chrome-stable --version
                  else
                    # Fallback: Install Chrome from Google's repository
                    echo "Installing Google Chrome from official repository..."
                    wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
                    echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
                    sudo apt-get update
                    sudo apt-get install -y google-chrome-stable
                    CHROME_BIN=$(which google-chrome-stable)
                  fi
                  echo "CHROME_PATH=$CHROME_BIN" >> $GITHUB_ENV

            - name: Install WordPress Playground CLI
              run: npm install -g @wp-playground/cli

            - name: Create MCP config for Chrome DevTools
              run: |
                  # Create MCP config with CHROME_PATH and permissive flags for CI sandbox
                  # Uses --chrome-arg to pass Chrome flags (per chrome-devtools-mcp docs)
                  # These flags grant maximum browser permissions since CI is isolated
                  cat > /tmp/mcp-config.json << EOF
                  {
                    "mcpServers": {
                      "chrome-devtools": {
                        "command": "npx",
                        "args": [
                          "-y", "chrome-devtools-mcp@latest",
                          "--headless",
                          "--isolated",
                          "--accept-insecure-certs",
                          "--chrome-arg=--no-sandbox",
                          "--chrome-arg=--disable-setuid-sandbox",
                          "--chrome-arg=--disable-web-security",
                          "--chrome-arg=--disable-features=IsolateOrigins,site-per-process",
                          "--chrome-arg=--allow-running-insecure-content",
                          "--chrome-arg=--autoplay-policy=no-user-gesture-required"
                        ],
                        "env": {
                          "CHROME_PATH": "${CHROME_PATH}"
                        }
                      },
                      "context7": {
                        "command": "npx",
                        "args": ["-y", "@context7/mcp"]
                      }
                    }
                  }
                  EOF
                  echo "MCP config created with CHROME_PATH: ${CHROME_PATH}"
                  cat /tmp/mcp-config.json

            - name: Run Claude Triage (Chrome DevTools)
              uses: anthropics/claude-code-action@v1
              env:
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_EVENT_NAME: ${{ github.event_name }}
                  GITHUB_ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
                  CLAUDE_CODE_ENABLE_TELEMETRY: '1'
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  trigger_phrase: '@claude-devtools'
                  show_full_output: true
                  prompt: |
                      # GitHub Context
                      REPO: ${{ github.repository }}
                      ISSUE NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
                      EVENT: ${{ github.event_name }}
                      ACTOR: ${{ github.actor }}

                      # Instructions
                      Execute: /triage-devtools ${{ github.event.issue.number || github.event.inputs.issue_number }}

                      # Note: Using Chrome DevTools MCP with subagent architecture for token efficiency
                  claude_args: |
                      --mcp-config /tmp/mcp-config.json
                      --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Skill,Task,mcp__chrome-devtools__click,mcp__chrome-devtools__close_page,mcp__chrome-devtools__drag,mcp__chrome-devtools__emulate,mcp__chrome-devtools__evaluate_script,mcp__chrome-devtools__fill,mcp__chrome-devtools__fill_form,mcp__chrome-devtools__get_console_message,mcp__chrome-devtools__get_network_request,mcp__chrome-devtools__handle_dialog,mcp__chrome-devtools__hover,mcp__chrome-devtools__list_console_messages,mcp__chrome-devtools__list_network_requests,mcp__chrome-devtools__list_pages,mcp__chrome-devtools__navigate_page,mcp__chrome-devtools__new_page,mcp__chrome-devtools__performance_analyze_insight,mcp__chrome-devtools__performance_start_trace,mcp__chrome-devtools__performance_stop_trace,mcp__chrome-devtools__press_key,mcp__chrome-devtools__resize_page,mcp__chrome-devtools__select_page,mcp__chrome-devtools__take_screenshot,mcp__chrome-devtools__take_snapshot,mcp__chrome-devtools__upload_file,mcp__chrome-devtools__wait_for,mcp__context7"

            - name: Cleanup processes
              if: always()
              run: |
                  # Gracefully terminate any remaining processes to prevent orphan cleanup issues
                  echo "Cleaning up Chrome and Node processes..."

                  # Kill any remaining Chrome processes
                  pkill -f chrome || true
                  pkill -f chromium || true

                  # Kill any remaining Node processes from MCP servers
                  pkill -f "chrome-devtools-mcp" || true
                  pkill -f "@context7/mcp" || true

                  # Kill any remaining Playground processes
                  pkill -f "wp-playground" || true

                  # Give processes time to terminate gracefully
                  sleep 2

                  echo "Cleanup complete"
