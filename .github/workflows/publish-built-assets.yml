# Builds and publishes the built assets for consumption by `wordpress-develop`.
name: Publish Built Assets

on:
    push:
        branches:
            - trunk
            - 'release/**'
            - 'wp/**'
    pull_request:
    workflow_dispatch:

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    publish-built-assets:
        name: Publish to GitHub Container Registry
        permissions:
            contents: read
            packages: write
        if: |
            github.repository == 'WordPress/gutenberg' &&
            (
              github.event_name == 'push' ||
              github.event_name == 'workflow_dispatch' ||
              (
                github.event_name == 'pull_request' &&
                github.event.pull_request.head.repo.full_name == github.repository
              )
            )
        uses: ./.github/workflows/reusable-publish-built-assets.yml
