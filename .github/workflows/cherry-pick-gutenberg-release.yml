name: Auto Cherry-Pick to Gutenberg Release

on:
    # closed: cherry-pick when a labeled PR is merged.
    # labeled: cherry-pick when a label is added after the PR is merged.
    # Using pull_request_target instead of pull_request so that the workflow
    # has access to repository secrets for fork PRs. The workflow never checks
    # out or runs code from the PR head: it only cherry-picks the merge commit,
    # which is already on trunk.
    # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#pull_request_target
    pull_request_target:
        types: [closed, labeled]
        branches:
            - trunk

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

env:
    # The Gutenberg backport label is versionless (the fast, two-week cadence
    # makes a per-release label impractical). The target release branch is
    # resolved by picking the highest `release/X.Y` branch.
    BACKPORT_LABEL: 'Backport to Gutenberg RC'

jobs:
    cherry-pick:
        runs-on: 'ubuntu-24.04'
        permissions:
            contents: write
            issues: write
            pull-requests: write
        # Only run for merged PRs carrying the backport label. For `labeled`
        # events, only react to the backport label itself, so that adding an
        # unrelated label to a merged PR does not retry a failed cherry-pick.
        if: >-
            github.event.pull_request.merged == true &&
            contains( github.event.pull_request.labels.*.name, 'Backport to Gutenberg RC' ) &&
            ( github.event.action == 'closed' || github.event.label.name == 'Backport to Gutenberg RC' )
        # Serialize cherry-picks so that concurrent pushes to the release
        # branch do not race. Declared at the job level so that the many
        # unrelated trunk merges (skipped by the `if` above) never enter the
        # group and replace a pending backport run.
        concurrency:
            group: ${{ github.workflow }}
            cancel-in-progress: false
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ secrets.GUTENBERG_TOKEN }}
                  fetch-depth: 0
                  persist-credentials: true

            - name: Determine target release branch
              id: target-branch
              run: |
                  # Pick the highest `release/X.Y` branch (version sort). Only
                  # match plain `X.Y` names so that scratch branches such as
                  # `release/24.2-cherry-pick` are never picked as the target.
                  VERSION="$(git for-each-ref --format='%(refname:lstrip=4)' 'refs/remotes/origin/release/' \
                    | grep -E '^[0-9]+\.[0-9]+$' \
                    | sort -V \
                    | tail -1)"
                  if [ -z "$VERSION" ]; then
                    echo "No release/X.Y branch found; nothing to cherry-pick to." >&2
                    exit 1
                  fi
                  echo "Highest release branch version: $VERSION"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Set up Git
              run: |
                  git config --global user.name "Gutenberg Repository Automation"
                  git config --global user.email "gutenberg@wordpress.org"

            - name: Cherry-pick the commit
              id: cherry-pick
              env:
                  TARGET_BRANCH: release/${{ steps.target-branch.outputs.version }}
                  COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
              run: |
                  echo "Target branch: $TARGET_BRANCH"
                  echo "Commit SHA: $COMMIT_SHA"
                  git checkout "$TARGET_BRANCH"
                  if git cherry-pick "$COMMIT_SHA"; then
                    echo "conflict=false" >> "$GITHUB_OUTPUT"
                    echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                    git push origin "$TARGET_BRANCH"
                  else
                    echo "conflict=true" >> "$GITHUB_OUTPUT"
                    git cherry-pick --abort
                  fi

            - name: Update the PR labels and milestone
              if: steps.cherry-pick.outputs.conflict == 'false'
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  VERSION: ${{ steps.target-branch.outputs.version }}
              with:
                  script: |
                      const prNumber = context.payload.pull_request.number;
                      await github.rest.issues.removeLabel({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: prNumber,
                        name: process.env.BACKPORT_LABEL
                      });

                      // Move the PR to the release milestone so that it is
                      // included in the changelog, as `npm run other:cherry-pick`
                      // does.
                      const milestoneTitle = `Gutenberg ${process.env.VERSION}`;
                      const milestones = await github.paginate(
                        github.rest.issues.listMilestones,
                        {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          state: 'all',
                          per_page: 100
                        }
                      );
                      const milestone = milestones.find(m => m.title === milestoneTitle);
                      if (milestone) {
                        await github.rest.issues.update({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: prNumber,
                          milestone: milestone.number
                        });
                      } else {
                        core.warning(`Milestone "${milestoneTitle}" not found; leaving the PR milestone unchanged.`);
                      }

            - name: Comment on the PR
              if: steps.cherry-pick.outputs.conflict == 'false'
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  TARGET_BRANCH: release/${{ steps.target-branch.outputs.version }}
                  CHERRY_PICK_SHA: ${{ steps.cherry-pick.outputs.sha }}
              with:
                  script: |
                      const { TARGET_BRANCH: targetBranch, CHERRY_PICK_SHA: cherryPickSha } = process.env;
                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.payload.pull_request.number,
                        body: `I just cherry-picked this PR to the ${targetBranch} branch to get it included in the next release: ${cherryPickSha}`
                      });

            - name: Comment on the PR about conflict
              if: steps.cherry-pick.outputs.conflict == 'true'
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  TARGET_BRANCH: release/${{ steps.target-branch.outputs.version }}
                  COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
              with:
                  script: |
                      const { TARGET_BRANCH: targetBranch, COMMIT_SHA: commitSha } = process.env;
                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.payload.pull_request.number,
                        body: `There was a conflict while trying to cherry-pick the commit to the ${targetBranch} branch. Please resolve the conflict manually and create a PR to the ${targetBranch} branch.

                        PRs to ${targetBranch} are similar to PRs to trunk, but you should base your PR on the ${targetBranch} branch instead of trunk.

                        \`\`\`
                        # Checkout the ${targetBranch} branch instead of trunk.
                        git checkout ${targetBranch}

                        # Create a new branch for your PR.
                        git checkout -b my-branch

                        # Cherry-pick the commit.
                        git cherry-pick ${commitSha}

                        # Check which files have conflicts.
                        git status

                        # Resolve the conflict...
                        # Add the resolved files to the staging area.
                        git status
                        git add .
                        git cherry-pick --continue

                        # Push the branch to the repository
                        git push origin my-branch

                        # Create a PR and set the base to the ${targetBranch} branch.
                        # See https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/changing-the-base-branch-of-a-pull-request.
                        \`\`\`
                        `
                      });
