# Block labels, by the block folders a PR changes. Run with sync-labels off, so a block
# label is only ever added, never removed (authors add them by hand too).
# A PR changing more than 3 blocks at once (a refactor) gets none.
changed-files-labels-limit: 3

'[Block] Accordion':
    - changed-files:
          - any-glob-to-any-file:
                - 'packages/block-library/src/accordion/**'
                - 'packages/block-library/src/accordion-heading/**'
                - 'packages/block-library/src/accordion-item/**'
                - 'packages/block-library/src/accordion-panel/**'

