name: 'Setup Node.js and install npm dependencies'
description: 'Configure Node.js and install npm dependencies.'
inputs:
    node-version:
        description: 'Optional. The Node.js version to use. When not specified, the version specified in .nvmrc will be used.'
        required: false
    cache:
        description: 'Optional. Whether to restore and save the npm cache. Set to false in workflows that publish built assets, so a poisoned cache cannot reach a release.'
        required: false
        default: 'true'

runs:
    using: 'composite'
    steps:
        - name: Use desired version of Node.js
          uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
          with:
              node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
              node-version: ${{ inputs.node-version }}
              check-latest: true
              package-manager-cache: false

        - name: Set up npm
          uses: ./.github/setup-npm
          with:
              cache: ${{ inputs.cache }}

        # No node_modules cache on release branches: its cache-hit path replays postinstall
        # scripts that older branches cannot run, so every branch installs the same way.
        - name: Install npm dependencies
          run: |
              npm ci
          shell: bash
        - name: Upload npm logs as an artifact on failure
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
          if: failure()
          with:
              name: npm-logs
              path: C:\npm\cache\_logs
