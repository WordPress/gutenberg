project: ui
kind: Breaking Changes
body: >-
    `Select`, `Autocomplete`, `Combobox`, and the select controls: `actionsRef` no
    longer keeps closed popups mounted. For externally controlled exit animations,
    call `eventDetails.preventUnmountOnClose()` in `onOpenChange` when closing,
    then `actionsRef.current?.unmount()` when the animation ends. Close through
    `actionsRef.current?.close()` to run that handler. Automatic CSS exit
    animations need no migration. See [Base UI's migration
    guide](https://github.com/mui/base-ui/pull/5734)
time: '2026-10-21T05:06:33.765Z'
custom:
