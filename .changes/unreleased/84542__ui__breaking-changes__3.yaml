project: ui
kind: Breaking Changes
body: >-
    `Autocomplete`, `Combobox`, and the searchable selects and controls:
    `onItemHighlighted` now receives native events. Accept `MouseEvent |
    PointerEvent` for pointer highlights, handle `none` when typing or clearing
    and `pointer` when hovering after keyboard navigation, and avoid canceling or
    stopping the event unless intended. See [Base UI
    #5838](https://github.com/mui/base-ui/pull/5838)
