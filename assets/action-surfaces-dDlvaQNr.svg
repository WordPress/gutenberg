<svg viewBox="0 0 880 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One action declaring a link target, materialized by three different host surfaces. In a More menu and in a footer the host mounts a real anchor, so link semantics survive. In a command palette no anchor fits, so the host mounts a command and the anchor semantics degrade. The fulfillment never changes; only the primitive the host mounts does.">
  <defs>
    <marker id="arrow-as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="868" height="368" rx="12" fill="#ffffff"/>

  <text x="440" y="38" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155">The same declaration, materialized by each surface.</text>

  <!-- The declaration -->
  <rect x="330" y="56" width="220" height="32" rx="6" fill="#fff3d0" stroke="#b07020" stroke-width="1.5"/>
  <text x="440" y="77" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="700" fill="#855317">href: 'site-health.php'</text>

  <!-- Fan -->
  <line x1="430" y1="92" x2="170" y2="122" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-as)"/>
  <line x1="440" y1="92" x2="440" y2="122" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-as)"/>
  <line x1="450" y1="92" x2="710" y2="122" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-as)"/>

  <!-- Surface 1: More menu -->
  <rect x="44" y="126" width="232" height="170" rx="9" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="160" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="700" fill="#334155">More menu</text>
  <text x="160" y="167" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="9" fill="#94a3b8">ships today</text>
  <rect x="62" y="180" width="196" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <line x1="62" y1="200" x2="258" y2="200" stroke="#e2e8f0" stroke-width="1"/>
  <text x="74" y="194" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="700" fill="#334155">Site Health</text>
  <circle cx="232" cy="191" r="1.5" fill="#64748b"/>
  <circle cx="238" cy="191" r="1.5" fill="#64748b"/>
  <circle cx="244" cy="191" r="1.5" fill="#64748b"/>
  <line x1="74" y1="212" x2="190" y2="212" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="74" y1="221" x2="160" y2="221" stroke="#e2e8f0" stroke-width="2.5"/>
  <rect x="156" y="234" width="102" height="30" rx="5" fill="#ffffff" stroke="#1d6b5a" stroke-width="1.2"/>
  <text x="166" y="247" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8" fill="#1d6b5a">View report</text>
  <text x="166" y="258" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8" fill="#94a3b8">About</text>
  <text x="160" y="284" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1d6b5a">a real anchor</text>

