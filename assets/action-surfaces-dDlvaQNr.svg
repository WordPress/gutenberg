  <text x="440" y="284" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1d6b5a">a real anchor</text>

  <!-- Surface 3: Command palette -->
  <rect x="604" y="126" width="232" height="170" rx="9" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="720" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="700" fill="#334155">Command palette</text>
  <text x="720" y="167" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="9" fill="#94a3b8">not built · needs a reach signal</text>
  <rect x="622" y="180" width="196" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <line x1="622" y1="204" x2="818" y2="204" stroke="#e2e8f0" stroke-width="1"/>
  <text x="634" y="197" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" fill="#94a3b8">report</text>
  <rect x="628" y="212" width="184" height="16" rx="3" fill="#f1f5f9"/>
  <text x="636" y="223" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8" fill="#334155">View report</text>
  <text x="636" y="242" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8" fill="#94a3b8">Reset dashboard</text>
  <text x="720" y="284" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#b07020">a command · anchor semantics degrade</text>

  <text x="440" y="336" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#855317">the fulfillment never changes · only the primitive the host mounts does</text>
</svg>
