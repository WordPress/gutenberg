  <text x="440" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="700" fill="#334155">Footer</text>
  <text x="440" y="167" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="9" fill="#94a3b8">not built</text>
  <rect x="342" y="180" width="196" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <line x1="342" y1="200" x2="538" y2="200" stroke="#e2e8f0" stroke-width="1"/>
  <text x="354" y="194" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="700" fill="#334155">Site Health</text>
  <line x1="354" y1="212" x2="470" y2="212" stroke="#e2e8f0" stroke-width="2.5"/>
