# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
    # Post the summary in CodeRabbit's own walkthrough comment rather than
    # editing the pull request description.
    high_level_summary_in_walkthrough: true
    # Don't post the review status comment.
    review_status: false
    auto_review:
        # Don't review every pull request. Reviews run when someone comments
        # `@coderabbitai review`, or when the keyword below is in the description.
        enabled: false
        description_keyword: '@coderabbitai review'

knowledge_base:
    code_guidelines:
        filePatterns:
            # CodeRabbit does not reliably read the `applyTo` frontmatter in
            # Copilot instruction files, so repeat the scope here.
            - files: '.github/instructions/lint-suppressions.instructions.md'
              applyTo: 'tools/eslint/suppressions.json,tools/stylelint/stylelint-suppressions.json'
